<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KABi Recognition — Voting Experience</title>
<style>
:root{
  --blue:#216AB1; --turq:#1EAFD9; --topaz:#0EB3AE; --meteor:#3D3185;
  --pTL:#61C5D2; --pTR:#1E5EA2; --pBL:#2866A8; --pBR:#3FA67D;
  --ink:#17293B; --muted:#5B7186; --line:#DCE8F2; --bg:#F5F9FC;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:Poppins,'Segoe UI',Calibri,Arial,sans-serif;color:var(--ink);background:var(--bg);}
button{font:inherit;cursor:pointer;border:none;background:none;}
input,textarea{font:inherit;}
#bgwash{position:fixed;inset:0;z-index:-2;background:var(--bg);transition:background-color .7s ease;}
#bgtex{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .7s ease;
  background:radial-gradient(900px 600px at 18% -8%, rgba(255,255,255,.22), transparent 60%),
             radial-gradient(1100px 800px at 105% 110%, rgba(0,0,0,.30), transparent 55%);}
body.oncolor #bgtex{opacity:1;}
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;flex-direction:column;}

/* ---------- petals ---------- */
.petal{display:inline-block;}
.pt-tl{border-radius:52% 52% 6% 52%;} .pt-tr{border-radius:52% 52% 52% 6%;}
.pt-bl{border-radius:52% 6% 52% 52%;} .pt-br{border-radius:6% 52% 52% 52%;}
.kmark{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.kmark .p{width:100%;height:100%;background:#DAE6F1;transition:background .2s;}
.kmark .p.lit-tl{background:var(--pTL);} .kmark .p.lit-tr{background:var(--pTR);}
.kmark .p.lit-bl{background:var(--pBL);} .kmark .p.lit-br{background:var(--pBR);}
.kmark .p.now{box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--turq);}
.kmark .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;
  background:#fff;border:2.5px solid #DAE6F1;transition:all .2s;}
.kmark .core.lit{background:var(--meteor);border-color:#fff;box-shadow:0 0 0 2px var(--meteor);}
.kmark .core.now{border-color:var(--turq);}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);}
.topbar.dark{background:transparent;border-bottom:1px solid rgba(255,255,255,.16);}
.brand{display:flex;align-items:center;gap:14px;}
.brand img{height:26px;display:block;}
.brand .sep{width:1px;height:22px;background:var(--line);}
.topbar.dark .brand .sep{background:rgba(255,255,255,.3);}
.brand .app{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.2px;}
.topbar.dark .brand .app{color:rgba(255,255,255,.85);}
.whoami{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.topbar.dark .whoami{color:rgba(255,255,255,.85);}
.whoami .av{width:30px;height:30px;border-radius:50% 50% 50% 4px;background:linear-gradient(135deg,var(--pBL),var(--pTL));
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.topbar.dark .whoami .av{box-shadow:0 0 0 2px rgba(255,255,255,.4);}

/* ---------- welcome ---------- */
.hero{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1100px 700px at 80% -10%, #2E77BE 0%, transparent 55%),
             linear-gradient(150deg,var(--meteor) 0%, #274A8F 55%, #1F6FB0 130%);}
.floatpetal{position:absolute;opacity:.16;filter:blur(1px);}
.fp1{width:340px;height:340px;background:var(--pTL);right:-70px;top:-80px;}
.fp2{width:260px;height:260px;background:var(--pBR);right:180px;bottom:-90px;}
.fp3{width:170px;height:170px;background:var(--pTR);right:-40px;bottom:170px;}
.hero-inner{position:relative;max-width:680px;padding:52px 32px;color:#fff;width:100%;}
.hero-logo{height:40px;display:block;margin-bottom:26px;}
.hero h1{font-size:clamp(30px,4.4vw,46px);line-height:1.12;font-weight:700;letter-spacing:-.5px;}
.hero .month{display:inline-block;margin-bottom:18px;padding:7px 16px;border:1px solid rgba(255,255,255,.45);
  border-radius:999px;font-size:13px;color:#fff;}
.hero p.lead{margin-top:14px;font-size:16px;line-height:1.6;color:#D8EDF8;max-width:56ch;}
.idcard{margin-top:26px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);
  border-radius:16px;padding:22px;backdrop-filter:blur(4px);}
.idcard .t{font-weight:600;font-size:15px;margin-bottom:4px;}
.idcard .s{font-size:13px;color:#C9E6F5;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:#C9E6F5;margin-bottom:6px;}
.field input{width:100%;padding:13px 14px;border-radius:9px;border:1.5px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.95);color:var(--ink);font-size:15px;outline:none;}
.field input:focus{border-color:#fff;}
.field .err{display:none;font-size:12px;color:#FFD9A8;margin-top:5px;}
.field.bad .err{display:block;}
.hero .rules{margin-top:20px;display:grid;gap:8px;font-size:13.5px;color:#C9E6F5;}
.hero .rules li{list-style:none;display:flex;gap:10px;align-items:flex-start;}
.hero .rules svg{flex:none;margin-top:2px;}
.cta{margin-top:8px;display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--blue);
  font-weight:600;font-size:16px;padding:14px 28px;border-radius:10px;transition:transform .15s,opacity .15s;}
.cta:disabled{opacity:.45;cursor:not-allowed;}
.cta:not(:disabled):hover{transform:translateY(-1px);}
.cta:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--turq);outline-offset:2px;}

/* ---------- immersive voting stage ---------- */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;color:#fff;
  padding:26px 20px 150px;position:relative;overflow:hidden;}
.stage .bigpetal{position:fixed;width:46vmin;height:46vmin;background:rgba(255,255,255,.07);
  right:-14vmin;bottom:-12vmin;z-index:-1;}
.stagehead{max-width:820px;width:100%;text-align:center;margin-top:14px;}
.stephint{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:rgba(255,255,255,.85);
  padding:6px 14px;border:1px solid rgba(255,255,255,.35);border-radius:999px;}
.stephint .petal{width:13px;height:13px;background:#fff;}
.stagehead h2{margin-top:16px;font-size:clamp(28px,3.6vw,42px);font-weight:700;line-height:1.12;letter-spacing:-.4px;}
.stagehead .q{margin-top:10px;font-size:16px;color:rgba(255,255,255,.92);}
.defwrap{margin-top:14px;}
.defbtn{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#fff;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:8px 16px;}
.defbody{max-width:640px;margin:14px auto 0;background:rgba(255,255,255,.13);border-radius:12px;
  padding:14px 18px;font-size:14px;line-height:1.6;text-align:left;}
.defbody b{display:block;font-size:11.5px;letter-spacing:.8px;margin-bottom:6px;opacity:.85;font-weight:700;}
.distinct{max-width:640px;margin:12px auto 0;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;
  color:rgba(255,255,255,.85);line-height:1.5;text-align:left;justify-content:center;}
.searchpill{margin-top:22px;width:100%;max-width:460px;display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:999px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.14);}
.searchpill input{border:none;outline:none;font-size:15px;width:100%;color:var(--ink);background:none;}
.searchpill svg{color:var(--muted);flex:none;}
.shufnote{margin-top:10px;font-size:12px;color:rgba(255,255,255,.7);}

/* spotlight for the chosen colleague */
.spot{width:100%;max-width:640px;margin-top:22px;background:#fff;border-radius:18px;padding:18px 20px;
  color:var(--ink);box-shadow:0 14px 34px rgba(0,0,0,.20);text-align:left;}
.spot .srow{display:flex;align-items:center;gap:14px;}
.spot .sav{width:56px;height:56px;border-radius:52% 52% 52% 6%;color:#fff;font-weight:600;font-size:18px;
  display:flex;align-items:center;justify-content:center;flex:none;}
.spot .snm{font-weight:700;font-size:17px;}
.spot .sjt{font-size:13px;color:var(--muted);margin-top:2px;}
.spot .slabel{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:.6px;color:#fff;
  padding:6px 12px;border-radius:999px;}
.spot textarea{width:100%;margin-top:14px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:14px;resize:vertical;min-height:56px;outline:none;}
.spot textarea:focus{border-color:var(--turq);}
.spot .count{font-size:11.5px;color:var(--muted);text-align:right;margin-top:4px;}
.spot .hint{font-size:12.5px;color:var(--muted);margin-top:10px;}

/* candidate cluster */
.cluster{margin-top:26px;display:flex;flex-wrap:wrap;justify-content:center;gap:20px 14px;max-width:900px;}
.chipav{width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  padding:10px 4px;border-radius:14px;transition:transform .12s;}
.chipav:not(.off):hover{transform:translateY(-3px);}
.chipav .cav{position:relative;width:64px;height:64px;border-radius:52% 52% 52% 8%;color:#fff;font-weight:600;font-size:19px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.18);
  border:3px solid transparent;transition:border-color .12s, box-shadow .12s;}
.chipav.sel .cav{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.35),0 8px 20px rgba(0,0,0,.25);}
.chipav .cav .mini{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;
  background:#fff;display:none;align-items:center;justify-content:center;}
.chipav.sel .cav .mini{display:flex;}
.chipav .cnm{font-size:13px;font-weight:600;color:#fff;line-height:1.25;}
.chipav .cjt{font-size:11px;color:rgba(255,255,255,.72);line-height:1.25;}
.chipav.off{opacity:.38;cursor:not-allowed;}
.chipav .cflag{font-size:10.5px;font-weight:700;color:#FFE1B0;}
.emptynote{margin-top:26px;color:rgba(255,255,255,.8);font-size:14px;}

/* glass bottom bar on color */
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:12px 28px;}
.pdots{display:flex;align-items:center;gap:9px;}
.pdots .d{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28);transition:all .2s;}
.pdots .d.done{background:rgba(255,255,255,.95);}
.pdots .d.now{width:28px;border-radius:7px;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22);}
.botbar.glass{background:rgba(10,16,34,.30);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.14);color:#fff;}
.botbar.light{background:#fff;border-top:1px solid var(--line);}
.progress{display:flex;align-items:center;gap:12px;}
.kchip{background:#fff;border-radius:12px;padding:6px;display:flex;}
.progress .kmark{width:36px;height:32px;}
.plabel{font-size:12.5px;line-height:1.35;}
.botbar.glass .plabel{color:rgba(255,255,255,.8);}
.botbar.light .plabel{color:var(--muted);}
.plabel b{display:block;font-size:13.5px;}
.botbar.glass .plabel b{color:#fff;}
.botbar.light .plabel b{color:var(--ink);}
.selected-note{font-size:13.5px;}
.botbar.glass .selected-note{color:rgba(255,255,255,.85);}
.navbtns{display:flex;gap:10px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:10px;font-weight:600;font-size:15px;}
.btn.onwhite{background:#fff;}
.btn.onwhite:disabled{background:rgba(255,255,255,.28);color:rgba(255,255,255,.75);cursor:not-allowed;}
.btn.ghostw{color:#fff;border:1.5px solid rgba(255,255,255,.5);}
.btn.primary{background:var(--blue);color:#fff;}
.btn.ghost{color:var(--muted);border:1.5px solid var(--line);background:#fff;}

/* ---------- review / done (light) ---------- */
.review{flex:1;max-width:760px;width:100%;margin:0 auto;padding:44px 24px 140px;}
.review h2{font-size:28px;font-weight:700;}
.completeband{margin-top:24px;display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:18px;
  background:linear-gradient(100deg, rgba(97,197,210,.14), rgba(30,94,162,.12) 34%, rgba(103,94,170,.12) 66%, rgba(63,166,125,.14));
  border:1.5px solid #D3E4F0;}
.completeband .kwrap{background:#fff;border-radius:999px;padding:11px 14px;box-shadow:0 6px 16px rgba(33,106,177,.14);display:flex;align-items:center;}
.cdots{display:flex;gap:7px;}
.cdots span{width:13px;height:13px;border-radius:50%;display:inline-block;}
.completeband .ct b{display:block;font-size:17px;font-weight:700;color:var(--ink);}
.completeband .ct span{font-size:13px;color:var(--muted);}
.completeband .okay{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#3BB691;color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;}
.review .sub{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.6;}
.voterline{margin-top:22px;display:flex;align-items:center;gap:14px;background:#EFF6FC;border:1.5px solid #CBE1F2;
  border-radius:12px;padding:14px 16px;}
.voterline .av{width:40px;height:40px;border-radius:52% 52% 52% 6%;background:linear-gradient(135deg,var(--pBL),var(--pTL));
  color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;}
.voterline .vn{font-weight:600;font-size:15px;}
.voterline .ve{font-size:12.5px;color:var(--muted);}
.voterline .edit{margin-left:auto;font-size:13px;color:var(--blue);font-weight:600;}
.rlist{margin-top:16px;display:grid;gap:12px;}
.rcard{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;}
.rcard .cat{flex:1;}
.rcard .cname{font-size:12.5px;font-weight:600;letter-spacing:.3px;}
.rcard .pname{font-size:16.5px;font-weight:600;margin-top:3px;}
.rcard .pjt{font-size:12.5px;color:var(--muted);margin-top:2px;}
.rcard .av{width:44px;height:44px;border-radius:52% 52% 52% 6%;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;}
.rcard .edit{font-size:13px;color:var(--blue);font-weight:600;padding:8px 12px;border-radius:8px;}
.rcard .edit:hover{background:var(--bg);}
.subm-err{margin-top:22px;background:#FDEDE7;border:1.5px solid #F0C9B8;color:#B4541E;border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:600;}
.lock{margin-top:22px;display:flex;gap:10px;align-items:flex-start;background:#FFF8E8;border:1.5px solid #F0DFAF;
  border-radius:12px;padding:14px 16px;font-size:13.5px;color:#7A5E14;line-height:1.55;}
.done-hero{flex:1;display:flex;align-items:center;justify-content:center;background:#fff;}
.done-inner{max-width:600px;padding:48px 28px;text-align:center;}
.done-mark-img{height:86px;width:auto;display:block;margin:0 auto;}
.done-inner h2{margin-top:26px;font-size:27px;font-weight:700;}
.done-inner .pill{display:inline-block;margin-top:14px;padding:8px 18px;border-radius:999px;
  background:#EAF8F3;color:#1F7F7C;font-weight:600;font-size:14px;}
.done-inner p{margin-top:16px;color:var(--muted);font-size:15px;line-height:1.65;}
.done-actions{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.done-inner .quote{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);font-style:italic;color:var(--muted);font-size:14.5px;}

/* ---------- IC console ---------- */
.icwrap{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:34px 24px 70px;}
.ichead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.ichead h2{font-size:26px;font-weight:700;}
.icpill{padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;}
.icpill.open{background:#EAF8F3;color:#1F7F7C;} .icpill.closed{background:#FDEDE7;color:#B4541E;}
.icout{margin-left:auto;font-size:13px;color:var(--blue);font-weight:600;}
.icgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px;}
.ickpi{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;}
.ickpi .l{font-size:12px;color:var(--muted);} .ickpi .v{font-size:22px;font-weight:700;color:var(--blue);margin-top:4px;}
.icsec{margin-top:28px;} .icsec h3{font-size:16px;color:var(--blue);margin-bottom:10px;}
.icsec .hint{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;}
.icbtns{display:flex;flex-wrap:wrap;gap:10px;}
.icrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#fff;
  border:1.5px solid var(--line);border-radius:10px;margin-bottom:7px;font-size:13.5px;}
.icrow .mut{color:var(--muted);font-size:12.5px;}
.iccat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.iccat .cn{font-size:13px;font-weight:700;margin-bottom:8px;}
.iccat .tl{font-size:13.5px;display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);}
.iccat .tl:last-child{border-bottom:none;}
.iccat .win{font-weight:700;}
.linkbox{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;}
.linkbox input{flex:1;border:none;outline:none;font-size:13px;color:var(--ink);background:none;}
.cyclebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;}
.cyclebar select,.cyclebar input{border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;outline:none;}
.isechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px;}
.isechead h3{margin-bottom:0;}
.btn.small{padding:8px 16px;font-size:13px;}
.empgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.empcard{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:13px 14px;}
.empcard .empinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.empcard .empinfo b{font-size:14px;line-height:1.25;}
.empcard .mut{font-size:12px;color:var(--muted);}
.empcard .eml{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.empadd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.empadd input{flex:1;min-width:170px;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;outline:none;}
.empadd input:focus{border-color:var(--turq);}
.empav{width:34px;height:34px;border-radius:52% 52% 52% 6%;color:#fff;font-weight:600;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex:none;}
.empdel{font-size:12.5px;font-weight:600;color:#B4541E;border:1.5px solid #F0D4C4;border-radius:8px;padding:7px 13px;background:#fff;}
.empdel:hover{background:#FDF3ED;}
.empmsg{font-size:12.5px;border-radius:9px;padding:9px 12px;margin-bottom:10px;}
.empmsg.good{background:#EAF8F3;color:#1F7F7C;} .empmsg.bad{background:#FDEDE7;color:#B4541E;}
.btn.isoff{opacity:.4;cursor:not-allowed;pointer-events:auto;}
.mailcard{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;}
.mailcard .mc-t b{display:block;font-size:14.5px;} .mailcard .mc-t span{font-size:12.5px;color:var(--muted);}
.mailcard .mc-b{display:flex;gap:8px;flex-wrap:wrap;}
.mailprev{margin:4px 0 14px;border:1.5px dashed #C9DDEE;border-radius:14px;overflow:auto;background:#F2F6FA;}
.icnote{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.6;background:#EFF6FC;border:1.5px solid #CBE1F2;border-radius:12px;padding:12px 14px;}

@media (max-width:640px){
  .topbar{padding:10px 16px;} .brand img{height:22px;} .brand .app{display:none;}
  .hero-logo{height:32px;}
  .stage{padding:18px 12px 170px;}
  .stagehead h2{font-size:27px;}

const cycleVotes = () => VOTES_STORE.filter(v => v.cycle === CYCLE);
function tallies(){ const t = {}; CATS.forEach(c => t[c.code] = {});
  cycleVotes().forEach(v => CATS.forEach(c => { const sel = v.selections[c.code];
    t[c.code][sel.id] = (t[c.code][sel.id] || 0) + 1; })); return t; }
function nameOf(id){
  const p = PEOPLE.find(x => x.id === id); if(p) return p.name;
  for(const v of VOTES_STORE){ for(const c of CATS){ const sel = v.selections[c.code];
    if(sel && sel.id === id) return sel.name; } }
  return id;
}
function top1Of(code, t){
  const list = topList(code, t);
  if(!list.length) return { text:"—", n:0, tie:false };
  const max = list[0].n, tops = list.filter(e=>e.n===max);
  return { text: tops.map(e=>nameOf(e.id)).join(" & ") + (tops.length>1?" (tie)":""), n:max, tie:tops.length>1 };
}
function topList(code, t){ return Object.entries(t[code])
  .map(([id, n]) => ({ id, n }))
  .sort((a, b) => b.n - a.n); }
const isSelf = p => (voter.email && p.email.toLowerCase() === voter.email.trim().toLowerCase())
  || (voter.name && normName(p.name) !== "" && normName(p.name) === normName(voter.name));
const nameOk = () => voter.name.trim().split(/\s+/).filter(w=>w.length>=2).length >= 2;
const emailOk = () => /^[^\s@]+@kabi\.ai$/i.test(voter.email.trim());
function pickedElsewhere(code, pid){
  if(!VALUE_CODES.includes(code)) return null;
  for(const c of VALUE_CODES){ if(c!==code && picks[c]===pid) return CATS.find(x=>x.code===c).short; }
  return null;
}
function setWash(color, oncolor){
  document.getElementById("bgwash").style.backgroundColor = color;
  document.body.classList.toggle("oncolor", !!oncolor);
}
function topbar(dark){
  const known = nameOk() && emailOk() && step>0;
  return `<div class="topbar ${dark?'dark':''}">
    <div class="brand"><img src="${dark?LOGO_WHITE:LOGO_COLOR}" alt="KABi"><span class="sep"></span><span class="app">Recognition</span></div>
    ${known?`<div class="whoami">Voting as <b>&nbsp;${esc(voter.name)}</b><span class="av">${initials(voter.name)}</span></div>`:""}</div>`;
}
function kmark(size){
  const done = c => !!picks[c];
  const cur  = CATS[step-1] ? CATS[step-1].petal : "";
  const pd = (pos,cls) => `<span class="p petal pt-${pos} ${done(cls)?'lit-'+pos:''} ${cur===pos?'now':''}"></span>`;
  return `<span class="kmark" style="width:${size}px;height:${Math.round(size*0.9)}px">
    ${pd("tl","INNOVATE")}${pd("tr","BUILD")}${pd("bl","KABITAL")}${pd("br","GROW")}
    <span class="core ${done("EOM")?'lit':''} ${cur==='core'?'now':''}"></span></span>`;
}
function pdots(){
  return `<span class="pdots" aria-label="Progress">${CATS.map((c,i)=>{
    const n=i+1, cls = n===step?"now": picks[c.code]?"done":"";
    return `<span class="d ${cls}" title="${esc(c.name)}"></span>`;}).join("")}</span>`;
}

/* ============ actions ============ */
function refreshStart(){
  const b=document.getElementById("startbtn");
  if(b) b.disabled = !(nameOk() && emailOk());
  document.querySelectorAll(".field").forEach((f,i)=>{
    const bad = i===0 ? (voter.name && !nameOk()) : (voter.email && !emailOk());
    f.classList.toggle("bad", !!bad);
  });
}
function start(){
  if(isIC()){ pwErr=false; go(8); return; }
  if(!VOTING_OPEN){ icMsg="closed"; render(); return; }
  icMsg="";
  for(const k of Object.keys(picks)){ const p=PEOPLE.find(x=>x.id===picks[k]); if(p && isSelf(p)) delete picks[k]; }
  go(1);
}
function pick(code,id){
  const p=PEOPLE.find(x=>x.id===id); if(p && isSelf(p)) return;
  picks[code] = (picks[code]===id) ? undefined : id;
  if(picks[code]===undefined) delete picks[code];
  render();
}
function go(n){ step=Math.max(0,n); if(step===9 && !icAuthed) step=8; query=""; defOpen=false; render(); window.scrollTo(0,0); }
function focusQ(){ const q=document.getElementById("q"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} }

async function submitVote(){
  for(let i=0;i<CATS.length;i++){
    const p = PEOPLE.find(x=>x.id===picks[CATS[i].code]);
    if(p && isSelf(p)){ delete picks[CATS[i].code]; go(i+1); return; }
  }
  const payload = buildPayload();
  if(!SUBMIT_ENDPOINT){ VOTES_STORE.push(payload); console.log("EOM_VOTE payload (demo mode)", payload); go(7); return; }
  submitState="sending"; submitErr=""; render();
  try{
    await api(payload);                     // receiver validates & writes the Excel/Sheet row
    VOTES_STORE.push(payload);
    submitState="idle"; go(7);
  }catch(e){
    submitState="idle";
    const msg = String(e.message||"");
    submitErr = msg.includes("duplicate") ? "You've already submitted your vote for this month."
             : msg.includes("closed")    ? "Voting for this month has closed."
             : msg.includes("ineligible")? "You are not eligible for this voting cycle."
             : "Something went wrong while submitting. Please check your connection and try again.";
    render();
  }
}
async function checkPw(){
  const v = (document.getElementById("pw")||{}).value || "";
  if(!SUBMIT_ENDPOINT){
    if(v === IC_PASSCODE_DEMO){ icCode = v; icAuthed = true; pwErr = false; go(9); }
    else { pwErr = true; render(); }
    return;
  }
  try{ await apiGet({action:"auth", code: v}); icCode = v; icAuthed = true; pwErr = false; go(9); }
  catch(e){ pwErr = true; render(); }
}
async function icLoadLive(){
  liveMsg = "Loading live data…"; render();
  try{
    const j = await apiGet({action:"votes", code: icCode, cycle: CYCLE});
    for(let i=VOTES_STORE.length-1;i>=0;i--){ if(VOTES_STORE[i].cycle===CYCLE) VOTES_STORE.splice(i,1); }
    (j.votes||[]).forEach(v=>VOTES_STORE.push(v));
    liveMsg = (j.votes||[]).length + " live vote(s) loaded for " + CYCLE_LABEL + ".";
  }catch(e){ liveMsg = "Couldn't load live data: " + (e.message||"error"); }
  render();
}
function icSignOut(){ icAuthed=false; icCode=""; voter.name=""; voter.email=""; icMsg=""; go(0); }
async function icToggle(){
  const next = !VOTING_OPEN;
  if(SUBMIT_ENDPOINT){
    try{ await api({action:"setState", code:icCode, cycle:CYCLE, open:next}); }
    catch(e){ liveMsg="Couldn't update voting state: "+(e.message||"error"); render(); return; }
  }
  VOTING_OPEN = next; render();
}
async function icNewCycle(){
  const m = parseInt(document.getElementById("ncM").value,10);
  const y = parseInt(document.getElementById("ncY").value,10);
  if(!y || y<2024 || y>2100) return;
  const newCycle = y + "-" + ("0"+m).slice(-2);
  if(SUBMIT_ENDPOINT){
    try{ await api({action:"setState", code:icCode, cycle:newCycle, open:true}); }
    catch(e){ liveMsg="Couldn't start the cycle on the receiver: "+(e.message||"error"); render(); return; }
  }
  CYCLE = newCycle; CYCLE_LABEL = MONTH_NAMES[m-1] + " " + y;
  VOTING_OPEN = true; icMsg=""; liveMsg = SUBMIT_ENDPOINT? "New cycle started for everyone: "+CYCLE_LABEL+".":"";
  render();
}
async function api(body){
  const r = await fetch(SUBMIT_ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body)});
  let j={}; try{ j = await r.json(); }catch(e){}
  if(!r.ok || j.ok===false) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}
async function apiGet(params){
  const r = await fetch(SUBMIT_ENDPOINT+"?"+new URLSearchParams(params).toString());
  const j = await r.json();
  if(j.ok===false) throw new Error(j.error||"error");
  return j;
}
const AV_G = [["#1E5EA2","#61C5D2"],["#675EAA","#1EAFD9"],["#2866A8","#3FA67D"],["#1F7F7C","#61C5D2"],["#3FA67D","#0EB3AE"],["#3D3185","#675EAA"]];
async function loadRoster(){
  if(!SUBMIT_ENDPOINT) return;
  try{
    const j = await apiGet({action:"roster"});
    if(Array.isArray(j.roster) && j.roster.length){
      PEOPLE.length = 0;
      j.roster.forEach((p,i)=>PEOPLE.push({ id:p.id||("EMP"+String(i+1).padStart(3,"0")),
        name:p.name, email:(p.email||"").toLowerCase(), jt:p.jt||"", g:AV_G[i%AV_G.length] }));
      CATS.forEach(c=>orders[c.code]=shuffle(PEOPLE.map(x=>x.id)));
    }
  }catch(e){}
}
async function loadState(){
  if(!SUBMIT_ENDPOINT) return;
  try{
    const j = await apiGet({action:"state"});
    if(j.cycle){ CYCLE = j.cycle;
      const mm = parseInt(CYCLE.slice(5),10);
      CYCLE_LABEL = MONTH_NAMES[mm-1] + " " + CYCLE.slice(0,4);
      VOTING_OPEN = j.open !== false; }
  }catch(e){}
}
async function bootLive(){ await loadState(); await loadRoster(); render(); }
const EMAIL_META = {
  start:    { label:"Start voting invitation", subject: () => "It's time to recognize a KABian — "+CYCLE_LABEL },
  reminder: { label:"Reminder to non-voters",  subject: () => "Reminder — your "+CYCLE_LABEL+" recognition vote is waiting" },
  winners:  { label:"Champions of the Month announcement", subject: () => CYCLE_LABEL+" — Champions of the Month" },
};
function icOpenDraft(kind){
  // ALWAYS an empty draft: no To, no BCC — IC adds the distribution list.
  const href = "mailto:?subject="+encodeURIComponent(EMAIL_META[kind].subject());
  const a=document.createElement("a"); a.href=href; document.body.appendChild(a); a.click(); a.remove();
}
const EF = "'Segoe UI', Calibri, Arial, sans-serif";
function emailShell(kicker, title, bodyHtml, footerNote){
  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F2F6FA"><tr><td align="center" style="padding:28px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="max-width:600px;width:100%;">
    <tr><td bgcolor="#216AB1" style="padding:24px 32px;">
      <img src="${LOGO_WHITE}" alt="KABi" height="28" style="display:block;height:28px;margin-bottom:10px;">
      <p style="margin:0;font-family:${EF};font-size:12px;font-weight:bold;color:#9FD4EC;letter-spacing:.5px;">${kicker}</p>
      <p style="margin:4px 0 0;font-family:${EF};font-size:23px;font-weight:bold;color:#FFFFFF;">${title}</p>
    </td></tr>
    <tr><td bgcolor="#0EB3AE" style="font-size:2px;line-height:2px;height:4px;">&nbsp;</td></tr>
    <tr><td style="padding:30px 32px;">${bodyHtml}</td></tr>
    <tr><td bgcolor="#3D3185" style="padding:16px 32px;">
      <p style="margin:0;font-family:${EF};font-size:12px;color:#CFC9E8;text-align:center;">${footerNote}</p>
    </td></tr>
  </table>
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;"><tr><td style="padding:12px 8px;">
    <p style="margin:0;font-family:${EF};font-size:11px;color:#6B7280;text-align:center;">Sent by the KABi IC Team &middot; ${IC_MAILBOX}</p>
  </td></tr></table>
</td></tr></table>`;
}
const eP = (t,extra="") => `<p style="margin:0 0 16px;font-family:${EF};font-size:15px;line-height:1.6;color:#1F2937;${extra}">${t}</p>`;
const eBtn = (label) => `<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:24px auto;"><tr><td bgcolor="#216AB1" style="border-radius:6px;"><a href="${VOTING_PAGE_URL}" target="_blank" style="display:inline-block;padding:13px 42px;font-family:${EF};font-size:15px;font-weight:bold;color:#FFFFFF;text-decoration:none;border-radius:6px;">${label}</a></td></tr></table>`;
const eStrip = (t) => `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:6px 0 18px;"><tr><td width="5" bgcolor="#0EB3AE" style="font-size:1px;line-height:1px;">&nbsp;</td><td bgcolor="#EAF6FB" style="padding:13px 16px;font-family:${EF};font-size:14px;color:#1F2937;">${t}</td></tr></table>`;
function emailHTML(kind){
  if(kind==="start") return emailShell("KABi Recognition", "It's time to recognize a KABian",
    eP("Hi KABians,")
    + eP("Recognition voting for <strong>"+CYCLE_LABEL+"</strong> is now open. Take 2&ndash;3 minutes to recognize one colleague for <strong>Employee of the Month</strong> and one KABian for each of our four values &mdash; We Build KABians, We Innovate to Transform, We Put Human KABital First, and We Grow Together.")
    + eStrip("<strong>Your vote is required.</strong> You cannot vote for yourself, each value goes to a different colleague, and voting closes on <strong>[Date]</strong> at <strong>[Time]</strong>.")
    + eBtn("Vote Now")
    + eP("Thank you for taking the time to recognize your fellow KABians.", "color:#6B7280;font-size:14px;"),
    "Your vote is confidential and can only be submitted once.");
  if(kind==="reminder") return emailShell("KABi Recognition &middot; Reminder", "Your recognition vote is waiting",
    eP("Hi,")
    + eP("You haven't submitted your recognition vote for <strong>"+CYCLE_LABEL+"</strong> yet. It takes 2&ndash;3 minutes &mdash; and it matters to the colleague you'll recognize.")
    + eStrip("Voting closes on <strong>[Date]</strong> at <strong>[Time]</strong>.")
    + eBtn("Vote Now"),
    "Your vote is confidential and can only be submitted once.");
  // winners
  const t = tallies();
  const rows = CATS.map(c=>{
    const list = topList(c.code, t);
    let name = "&mdash;", votes = "";
    if(list.length){ const max=list[0].n; const tops=list.filter(e=>e.n===max);
      name = tops.map(e=>nameOf(e.id)).join(" &amp; ");
      votes = max+" vote"+(max>1?"s":"")+(tops.length>1?" each &middot; tie":""); }
    return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 10px;"><tr>
      <td width="5" bgcolor="${c.accent}" style="font-size:1px;line-height:1px;">&nbsp;</td>
      <td bgcolor="#F7FAFD" style="padding:12px 16px;">
        <p style="margin:0;font-family:${EF};font-size:11.5px;font-weight:bold;letter-spacing:.5px;color:${c.accent};">${c.name.toUpperCase()}</p>
        <p style="margin:3px 0 0;font-family:${EF};font-size:17px;font-weight:bold;color:#1F2937;">${name}</p>
        ${votes?`<p style="margin:2px 0 0;font-family:${EF};font-size:12.5px;color:#6B7280;">${votes}</p>`:""}
      </td></tr></table>`;
  }).join("");
  return emailShell("KABi Recognition", "Champions of the Month — "+CYCLE_LABEL,
    eP("Hi KABians,")
    + eP("Join us in celebrating the colleagues you recognized this month:")
    + rows
    + eP("Congratulations to everyone recognized &mdash; and thank you for noticing the difference your colleagues make.", "margin-top:18px;"),
    "Winners were selected by your votes, reviewed and approved by HC.");
}
async function icCopyEmail(kind){
  const html = emailHTML(kind);
  const plain = EMAIL_META[kind].subject()+"\n\n(Designed email — paste into the Outlook draft body.)";
  try{
    await navigator.clipboard.write([new ClipboardItem({
      "text/html": new Blob([html], {type:"text/html"}),
      "text/plain": new Blob([plain], {type:"text/plain"}),
    })]);
    copiedKind = kind; render();
  }catch(e){ previewKind = kind; copiedKind = null; render(); }
}
function icPreview(kind){ previewKind = (previewKind===kind? null : kind); render(); }
function icAddEmp(){
  const n = ((document.getElementById("empN")||{}).value||"").trim();
  const em = ((document.getElementById("empE")||{}).value||"").trim().toLowerCase();
  const jt = ((document.getElementById("empJ")||{}).value||"").trim();
  if(n.split(/\s+/).filter(w=>w.length>=2).length < 2){ empMsg="err:Enter the employee's first and family name."; render(); return; }
  if(!/^[^\s@]+@kabi\.ai$/i.test(em)){ empMsg="err:Email must be a @kabi.ai address."; render(); return; }
  if(PEOPLE.some(p=>p.email.toLowerCase()===em)){ empMsg="err:That email is already in the list."; render(); return; }
  if(!jt){ empMsg="err:Enter a job title."; render(); return; }
  const num = Math.max(0, ...PEOPLE.map(p=>parseInt(p.id.slice(3),10)||0)) + 1;
  const id = "EMP" + String(num).padStart(3,"0");
  const G = [["#1E5EA2","#61C5D2"],["#675EAA","#1EAFD9"],["#2866A8","#3FA67D"],["#1F7F7C","#61C5D2"],["#3FA67D","#0EB3AE"],["#3D3185","#675EAA"]];
  if(SUBMIT_ENDPOINT){
    api({action:"addEmp", code:icCode, emp:{id,name:n,email:em,jt}})
      .then(()=>loadRoster()).then(()=>{ empMsg="ok:"+n+" added — visible to all voters immediately."; empListOpen=true; render(); })
      .catch(e=>{ empMsg="err:Couldn't add on the receiver: "+(e.message||"error"); render(); });
    return;
  }
  PEOPLE.push({ id, name:n, email:em, jt, g:G[PEOPLE.length % G.length] });
  CATS.forEach(c=>orders[c.code].splice(Math.floor(Math.random()*(orders[c.code].length+1)), 0, id));
  empMsg = "ok:" + n + " added — visible to all voters immediately."; empListOpen = true;
  render();
}
async function icDelEmp(id){
  const i = PEOPLE.findIndex(p=>p.id===id); if(i<0) return;
  const nm = PEOPLE[i].name;
  if(SUBMIT_ENDPOINT){
    try{ await api({action:"delEmp", code:icCode, id}); await loadRoster(); }
    catch(e){ empMsg="err:Couldn't remove on the receiver: "+(e.message||"error"); render(); return; }
  } else {
    PEOPLE.splice(i,1);
    CATS.forEach(c=>{ orders[c.code] = orders[c.code].filter(x=>x!==id); });
  }
  CATS.forEach(c=>{ if(picks[c.code]===id) delete picks[c.code]; });
  empMsg = "ok:" + nm + " removed from the candidate list. Votes already received stay counted under their name."; empListOpen = true;
  render();
}
function updateLiveLink(){
  const a = document.getElementById("liveopen"), h = document.getElementById("livehint");
  if(!a) return;
  const ok = isLiveUrlOk(CSV_LIVE_URL);
  a.classList.toggle("isoff", !ok);
  if(ok){ a.href = CSV_LIVE_URL.trim(); a.target = "_blank"; a.rel = "noopener"; a.onclick = null; a.removeAttribute("aria-disabled"); }
  else { a.href = "#"; a.onclick = () => false; a.setAttribute("aria-disabled","true"); }
  if(h) h.style.display = ok ? "none" : "";
}
function monthTag(){ const y=CYCLE.slice(0,4), mm=parseInt(CYCLE.slice(5),10); return MONTH_NAMES[mm-1].slice(0,3)+" "+y; }
function xEsc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function icDownloadXls(){
  const TINT = { EOM:"#D8D6EA", BUILD:"#D2DFEC", INNOVATE:"#D2E8EB", KABITAL:"#E1DEEE", GROW:"#D5E8E0" };
  const votes = cycleVotes();
  const cols = [
    {w:150,h:"Voter Name",st:"hMeta"},{w:190,h:"Voter Email",st:"hMeta"},{w:120,h:"Submitted At",st:"hMeta"},
  ];
  const t1 = tallies();
  CATS.forEach(c=>{ cols.push({w:150,h:c.name,st:"hC_"+c.code}); cols.push({w:230,h:"Why — "+c.short,st:"hW_"+c.code});
    cols.push({w:170,h:"Top 1 as "+(c.code==="EOM"?"EoM":c.short),st:"hC_"+c.code}); });
  const border = '<Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#C9DDEE"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#C9DDEE"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#C9DDEE"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#C9DDEE"/></Borders>';
  let styles = `
   <Style ss:ID="title"><Font ss:FontName="Calibri" ss:Size="15" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#216AB1" ss:Pattern="Solid"/><Alignment ss:Vertical="Center"/></Style>
   <Style ss:ID="sub"><Font ss:FontName="Calibri" ss:Size="10" ss:Color="#FFFFFF"/><Interior ss:Color="#0EB3AE" ss:Pattern="Solid"/><Alignment ss:Vertical="Center"/></Style>
   <Style ss:ID="hMeta"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#216AB1" ss:Pattern="Solid"/><Alignment ss:Vertical="Center" ss:WrapText="1"/>${border}</Style>
   <Style ss:ID="cA"><Font ss:FontName="Calibri" ss:Size="11" ss:Color="#17293B"/><Alignment ss:Vertical="Top" ss:WrapText="1"/>${border}</Style>
   <Style ss:ID="cB"><Font ss:FontName="Calibri" ss:Size="11" ss:Color="#17293B"/><Interior ss:Color="#EAF6FB" ss:Pattern="Solid"/><Alignment ss:Vertical="Top" ss:WrapText="1"/>${border}</Style>`;
  CATS.forEach(c=>{
    styles += `
   <Style ss:ID="hC_${c.code}"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="${c.accent}" ss:Pattern="Solid"/><Alignment ss:Vertical="Center" ss:WrapText="1"/>${border}</Style>
   <Style ss:ID="hW_${c.code}"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#17293B"/><Interior ss:Color="${TINT[c.code]}" ss:Pattern="Solid"/><Alignment ss:Vertical="Center" ss:WrapText="1"/>${border}</Style>
   <Style ss:ID="tT_${c.code}"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="${c.accent}"/><Interior ss:Color="${TINT[c.code]}" ss:Pattern="Solid"/><Alignment ss:Vertical="Top" ss:WrapText="1"/>${border}</Style>`;
  });
  const colXml = cols.map(c=>`<Column ss:AutoFitWidth="0" ss:Width="${c.w}"/>`).join("");
  const titleRow = `<Row ss:Height="30"><Cell ss:StyleID="title" ss:MergeAcross="${cols.length-1}"><Data ss:Type="String">KABi — Employee of the Month · Votes · ${xEsc(CYCLE_LABEL)}</Data></Cell></Row>`;
  const subRow = `<Row ss:Height="16"><Cell ss:StyleID="sub" ss:MergeAcross="${cols.length-1}"><Data ss:Type="String">IC-restricted — voter-to-choice data. Never share this file. ${votes.length} vote${votes.length===1?"":"s"} recorded.</Data></Cell></Row>`;
  const headRow = `<Row ss:Height="30">${cols.map(c=>`<Cell ss:StyleID="${c.st}"><Data ss:Type="String">${xEsc(c.h)}</Data></Cell>`).join("")}</Row>`;
  const dataRows = votes.map((v,i)=>{
    const st = i%2 ? "cB" : "cA";
    const cells = [{t:v.voterName,s:st},{t:v.voterEmail,s:st},{t:v.submittedAt.replace("T"," ").slice(0,16),s:st}];
    CATS.forEach(c=>{ const sel=v.selections[c.code];
      cells.push({t: sel? sel.name : "", s:st});
      cells.push({t: sel? (sel.why||"") : "", s:st});
      cells.push({t: i===0? top1Of(c.code,t1).text + (top1Of(c.code,t1).n? " · "+top1Of(c.code,t1).n+" vote"+(top1Of(c.code,t1).n>1?"s":"") : "") : "", s: i===0? "tT_"+c.code : st});
    });
    return `<Row>${cells.map(x=>`<Cell ss:StyleID="${x.s}"><Data ss:Type="String">${xEsc(x.t)}</Data></Cell>`).join("")}</Row>`;
  }).join("\n");
  const xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <Styles>${styles}
 </Styles>
 <Worksheet ss:Name="${xEsc(monthTag())}">
  <Table>${colXml}
   ${titleRow}
   ${subRow}
   ${headRow}
   ${dataRows}
  </Table>
  <WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel">
   <FreezePanes/><FrozenNoSplit/><SplitHorizontal>3</SplitHorizontal><TopRowBottomPane>3</TopRowBottomPane><ActivePane>2</ActivePane>
  </WorksheetOptions>
 </Worksheet>
</Workbook>`;
  const blob = new Blob([xml], {type:"application/vnd.ms-excel"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="KABi-EOM-votes-"+monthTag()+".xls";
  document.body.appendChild(a); a.click(); a.remove();
}
function buildPayload(){
  const selections = {};
  CATS.forEach(c=>{ const p=PEOPLE.find(x=>x.id===picks[c.code]);
    selections[c.code] = { id:p.id, name:p.name, why:(whys[c.code]||"").trim() }; });
  return { cycle:CYCLE, voterName:voter.name.trim(), voterEmail:voter.email.trim(),
           submittedAt:new Date().toISOString(), selections };
}
render();
if(SUBMIT_ENDPOINT) bootLive();
</script>
