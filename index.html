<style>
:root{
  --blue:#216AB1; --turq:#1EAFD9; --topaz:#0EB3AE; --meteor:#3D3185;
  --pTL:#61C5D2; --pTR:#1E5EA2; --pBL:#2866A8; --pBR:#3FA67D;
  --ink:#17293B; --muted:#5B7186; --line:#DCE8F2; --bg:#F5F9FC;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;} body{min-height:100%;}
body{font-family:Poppins,'Segoe UI',Calibri,Arial,sans-serif;color:var(--ink);background:var(--bg);}
button{font:inherit;cursor:pointer;border:none;background:none;}
input,textarea{font:inherit;}
#bgwash{position:fixed;inset:0;z-index:-2;background:var(--bg);transition:background-color .7s ease;}
#bgtex{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .7s ease;
  background:radial-gradient(900px 600px at 18% -8%, rgba(255,255,255,.22), transparent 60%),
             radial-gradient(1100px 800px at 105% 110%, rgba(0,0,0,.30), transparent 55%);}
body.oncolor #bgtex{opacity:1;}
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;flex-direction:column;}

/* ---------- petals ---------- */
.petal{display:inline-block;}
.pt-tl{border-radius:52% 52% 6% 52%;} .pt-tr{border-radius:52% 52% 52% 6%;}
.pt-bl{border-radius:52% 6% 52% 52%;} .pt-br{border-radius:6% 52% 52% 52%;}
.kmark{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.kmark .p{width:100%;height:100%;background:#DAE6F1;transition:background .2s;}
.kmark .p.lit-tl{background:var(--pTL);} .kmark .p.lit-tr{background:var(--pTR);}
.kmark .p.lit-bl{background:var(--pBL);} .kmark .p.lit-br{background:var(--pBR);}
.kmark .p.now{box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--turq);}
.kmark .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;
  background:#fff;border:2.5px solid #DAE6F1;transition:all .2s;}
.kmark .core.lit{background:var(--meteor);border-color:#fff;box-shadow:0 0 0 2px var(--meteor);}
.kmark .core.now{border-color:var(--turq);}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);}
.topbar.dark{background:transparent;border-bottom:1px solid rgba(255,255,255,.16);}
.brand{display:flex;align-items:center;gap:14px;}
.brand img{height:26px;display:block;}
.brand .sep{width:1px;height:22px;background:var(--line);}
.topbar.dark .brand .sep{background:rgba(255,255,255,.3);}
.brand .app{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.2px;}
.topbar.dark .brand .app{color:rgba(255,255,255,.85);}
.whoami{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.topbar.dark .whoami{color:rgba(255,255,255,.85);}
.whoami .av{width:30px;height:30px;border-radius:50% 50% 50% 4px;background:linear-gradient(135deg,var(--pBL),var(--pTL));
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.topbar.dark .whoami .av{box-shadow:0 0 0 2px rgba(255,255,255,.4);}

/* ---------- welcome ---------- */
.hero{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1100px 700px at 80% -10%, #2E77BE 0%, transparent 55%),
             linear-gradient(150deg,var(--meteor) 0%, #274A8F 55%, #1F6FB0 130%);}
.floatpetal{position:absolute;opacity:.16;filter:blur(1px);}
.fp1{width:340px;height:340px;background:var(--pTL);right:-70px;top:-80px;}
.fp2{width:260px;height:260px;background:var(--pBR);right:180px;bottom:-90px;}
.fp3{width:170px;height:170px;background:var(--pTR);right:-40px;bottom:170px;}
.hero-inner{position:relative;max-width:680px;padding:52px 32px;color:#fff;width:100%;}
.hero-logo{height:40px;display:block;margin-bottom:26px;}
.hero h1{font-size:clamp(30px,4.4vw,46px);line-height:1.12;font-weight:700;letter-spacing:-.5px;}
.hero .month{display:inline-block;margin-bottom:18px;padding:7px 16px;border:1px solid rgba(255,255,255,.45);
  border-radius:999px;font-size:13px;color:#fff;}
.hero p.lead{margin-top:14px;font-size:16px;line-height:1.6;color:#D8EDF8;max-width:56ch;}
.idcard{margin-top:26px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);
  border-radius:16px;padding:22px;backdrop-filter:blur(4px);}
.idcard .t{font-weight:600;font-size:15px;margin-bottom:4px;}
.idcard .s{font-size:13px;color:#C9E6F5;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:#C9E6F5;margin-bottom:6px;}
.field input{width:100%;padding:13px 14px;border-radius:9px;border:1.5px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.95);color:var(--ink);font-size:15px;outline:none;}
.field input:focus{border-color:#fff;}
.field .err{display:none;font-size:12px;color:#FFD9A8;margin-top:5px;}
.field.bad .err{display:block;}
.hero .rules{margin-top:20px;display:grid;gap:8px;font-size:13.5px;color:#C9E6F5;}
.hero .rules li{list-style:none;display:flex;gap:10px;align-items:flex-start;}
.hero .rules svg{flex:none;margin-top:2px;}
.cta{margin-top:8px;display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--blue);
  font-weight:600;font-size:16px;padding:14px 28px;border-radius:10px;transition:transform .15s,opacity .15s;}
.cta:disabled{opacity:.45;cursor:not-allowed;}
.cta:not(:disabled):hover{transform:translateY(-1px);}
.cta:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--turq);outline-offset:2px;}

/* ---------- editorial story (scroll chapters) ---------- */
.story{position:fixed;inset:0;top:0;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;
  background:#F6F9FC;-webkit-overflow-scrolling:touch;}
.chap{min-height:100vh;scroll-snap-align:start;display:grid;align-items:center;position:relative;}
.chap.split{grid-template-columns:1.05fr 1fr;}
@media (max-width:900px){ .chap.split{grid-template-columns:1fr;} .chap .visual{min-height:44vh;} }
.chap .visual{position:relative;overflow:hidden;height:100%;min-height:52vh;display:flex;align-items:center;justify-content:center;}
.chap .visual .glyph{width:46%;max-width:280px;aspect-ratio:1;background:rgba(255,255,255,.22);}
.chap .visual .ring{position:absolute;width:74%;aspect-ratio:1;border:1px solid rgba(255,255,255,.28);border-radius:50%;}
.chap .copy{padding:8vh 7vw;max-width:760px;}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:2.2px;
  text-transform:uppercase;color:var(--blue);}
.kicker::before{content:"";width:26px;height:1.5px;background:var(--blue);}
.chap h2.disp{margin-top:14px;font-size:clamp(32px,4.2vw,54px);line-height:1.06;font-weight:700;letter-spacing:-1.2px;color:var(--ink);}
.chap p.body{margin-top:18px;font-size:17px;line-height:1.75;color:var(--muted);max-width:56ch;}
.chap p.body b{color:var(--ink);font-weight:600;}
.onDark .kicker{color:rgba(255,255,255,.85);} .onDark .kicker::before{background:rgba(255,255,255,.7);}
.onDark h2.disp{color:#fff;} .onDark p.body{color:rgba(255,255,255,.88);} .onDark p.body b{color:#fff;}
.hero-chap{display:grid;grid-template-columns:1.06fr .94fr;align-items:center;padding:0 0 0 7vw;position:relative;
  background:#0B2545;overflow:hidden;}
@media (max-width:980px){ .hero-chap{grid-template-columns:1fr;padding:0 7vw;} .heroart{display:none;} }
.hero-chap::before{content:"";position:absolute;inset:-20%;
  background:radial-gradient(48% 42% at 22% 28%, rgba(29,87,163,.75), transparent 62%),
             radial-gradient(45% 40% at 78% 34%, rgba(98,198,211,.30), transparent 60%),
             radial-gradient(52% 48% at 62% 82%, rgba(63,170,126,.28), transparent 62%),
             linear-gradient(140deg,#0B2545 0%,#123A69 55%,#1D57A3 120%);
  animation:mesh 22s ease-in-out infinite alternate;}
@keyframes mesh{0%{transform:scale(1) translate(0,0);}100%{transform:scale(1.08) translate(-2%,-2%);}}
.hero-copy{position:relative;z-index:2;padding:0 2vw 0 0;}
.hero-rule{width:1px;height:58px;background:linear-gradient(rgba(255,255,255,.7),transparent);margin-bottom:22px;}
.hero-chap .idx{position:absolute;right:7vw;bottom:38px;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.45);z-index:2;}

/* the K-mark, drawn in hairlines */
.heroart{position:relative;height:100%;min-height:100vh;z-index:1;}
.kline{position:absolute;left:50%;top:50%;width:min(44vw,540px);aspect-ratio:1;transform:translate(-50%,-50%);}
.kline svg{width:100%;height:100%;overflow:visible;}
.kline .pl2{fill:none;stroke-width:1.5;filter:drop-shadow(0 0 6px rgba(255,255,255,.18));vector-effect:non-scaling-stroke;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  animation:draw 2.6s cubic-bezier(.3,.8,.3,1) forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.kline .fillsoft{opacity:0;animation:soften 1.4s ease 2.2s forwards;}
@keyframes soften{to{opacity:.13;}}
.kline .spin{transform-origin:50% 50%;animation:spin 48s linear infinite;}
.kline .spin-r{transform-origin:50% 50%;animation:spin 72s linear infinite reverse;}
.kline .ray{stroke:rgba(255,255,255,.14);stroke-width:.6;vector-effect:non-scaling-stroke;}
.kline .ring4{fill:none;stroke:rgba(255,255,255,.12);stroke-width:.7;vector-effect:non-scaling-stroke;}
.kline .ring4.dash{stroke-dasharray:2 9;stroke:rgba(255,255,255,.22);}
.kline .cdot2{fill:#fff;animation:pulse2 5s ease-in-out infinite;}
@keyframes pulse2{0%,100%{r:4;opacity:.85;}50%{r:5.6;opacity:1;}}

/* hairline system — a quiet KABi line motif behind every screen */
.lines{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.lines svg{position:absolute;inset:0;width:100%;height:100%;}
.lines .hl{fill:none;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.16;}
.lines.dark .hl{opacity:.22;}
.vchip2{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:9px 16px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:13px;}
.vchip2 .d2{width:9px;height:9px;border-radius:50%;background:var(--vb2);box-shadow:0 0 10px 2px var(--vb2);}
@media (prefers-reduced-motion: reduce){ .hero-chap::before,.kstage .halo,.kstage .orbit3,.pa,.kstage .core2{animation:none;} .pa{opacity:.92;transform:none;} }
.hero-chap .mono{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.7);}
.hero-chap h1{margin-top:18px;font-size:clamp(40px,6.2vw,86px);line-height:1;font-weight:700;letter-spacing:-2px;color:#fff;max-width:16ch;}
.hero-chap .sub{margin-top:22px;font-size:18px;line-height:1.7;color:rgba(255,255,255,.9);max-width:52ch;}
.scrollcue{position:absolute;bottom:38px;left:7vw;display:flex;align-items:center;gap:12px;
  font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.75);}
.scrollcue .line{width:44px;height:1px;background:rgba(255,255,255,.55);position:relative;overflow:hidden;}
.scrollcue .line::after{content:"";position:absolute;inset:0;background:#fff;transform:translateX(-100%);
  animation:cue 2.4s ease-in-out infinite;}
@keyframes cue{0%{transform:translateX(-100%);}55%{transform:translateX(100%);}100%{transform:translateX(100%);}}
.scrolldown{position:absolute;left:7vw;bottom:54px;transform:none;z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:-6px;background:none;border:none;cursor:pointer;
  padding:6px 18px;}
.scrolldown svg{display:block;transform:scaleX(1.7);color:rgba(255,255,255,.6);filter:drop-shadow(0 2px 10px rgba(0,0,0,.25));
  animation:chev 2.2s cubic-bezier(.4,0,.2,1) infinite;}
.scrolldown svg:nth-child(2){margin-top:-26px;color:rgba(255,255,255,.3);animation-delay:.18s;}
.scrolldown:hover svg{color:rgba(255,255,255,.9);}
@keyframes chev{0%{transform:translateY(-5px);opacity:.25;}45%{transform:translateY(5px);opacity:1;}100%{transform:translateY(-5px);opacity:.25;}}
.scrolldown.dark svg{color:rgba(23,41,59,.35);} .scrolldown.dark svg:nth-child(2){color:rgba(23,41,59,.2);}
@media (prefers-reduced-motion: reduce){ .scrolldown svg{animation:none;} }
@media (max-width:640px){ .scrolldown{bottom:86px;} .scrolldown svg{width:46px;height:46px;} }
.rev{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.22,.9,.24,1),transform .9s cubic-bezier(.22,.9,.24,1);}
.rev.in{opacity:1;transform:none;}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:#E4ECF4;}
@media (max-width:820px){ .vgrid{grid-template-columns:1fr;} }
.vcell{background:#fff;padding:28px 30px;min-height:25vh;display:flex;flex-direction:column;justify-content:center;
  position:relative;transition:background .5s ease;}
.vcell .vnum{font-size:11px;letter-spacing:2px;color:var(--muted);}
.vcell h3{margin-top:10px;font-size:22px;font-weight:700;letter-spacing:-.4px;color:var(--ink);}
.vcell p{margin-top:10px;font-size:14.5px;line-height:1.7;color:var(--muted);}
.vcell .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vb);}
.vcell.live{background:#0E2E56;}
.vcell.live .vnum{color:rgba(255,255,255,.7);} .vcell.live h3,.vcell.live p{color:#fff;}
.vcell.live p{color:rgba(255,255,255,.85);}
.vcell.live .bar{background:#fff;animation:barGlow 5.5s ease-in-out infinite;}
@keyframes barGlow{0%,100%{box-shadow:0 0 10px 0 rgba(255,255,255,.35);}50%{box-shadow:0 0 22px 4px rgba(255,255,255,.6);}}
.vcell .thism{position:absolute;top:22px;right:26px;font-size:10px;letter-spacing:1.6px;font-weight:700;color:#fff;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);padding:5px 12px;border-radius:999px;}
.storybar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px 7vw;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);}
.storybar .where{font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);}
.storybar .where b{color:var(--ink);letter-spacing:0;text-transform:none;font-size:14.5px;display:block;margin-top:2px;}
.cdot{display:flex;gap:7px;}
.cdot span{width:7px;height:7px;border-radius:50%;background:#C9DAE8;transition:all .35s;}
.cdot span.on{width:22px;border-radius:4px;background:var(--blue);}
@media (prefers-reduced-motion: reduce){ .rev{opacity:1;transform:none;} .scrollcue .line::after,.vcell.live .bar{animation:none;} }
/* ---------- intro stations ---------- */
.eombox{display:flex;align-items:flex-start;gap:18px;text-align:left;margin-top:26px;padding:22px 24px;
  border-radius:20px;background:#F6F9FC;border:1px solid #fff;
  box-shadow:0 22px 48px rgba(0,0,0,.30);position:relative;overflow:hidden;}
.eombox::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(#1D57A3,#62C6D3);}
.eombox + .eombox{margin-top:12px;}
.eombox.v2::after{background:linear-gradient(#3FAA7E,#62C6D3);}
.eombox.v2 .ic{background:linear-gradient(135deg,#3FAA7E,#2E8A66);}
.eombox.v2 .tag{color:#2E8A66;}
.eombox .ic{width:52px;height:52px;flex:none;border-radius:52% 52% 52% 8%;
  background:linear-gradient(135deg,#1D57A3,#2866A8);display:flex;align-items:center;justify-content:center;color:#fff;}
.eombox .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;color:#1D57A3;margin-bottom:4px;}
.eombox h3{font-size:21px;font-weight:700;line-height:1.2;color:var(--ink);}
.eombox p{margin-top:8px;font-size:14px;line-height:1.65;color:var(--muted);max-width:70ch;}
.instrhead{display:flex;align-items:center;gap:12px;margin:30px 0 14px;text-align:left;}
.instrhead b{font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.85);}
.instrhead .ln{flex:1;height:1px;background:rgba(255,255,255,.28);}
.instr{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px;text-align:left;}
.instr .item{display:flex;gap:13px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);
  border-radius:15px;padding:16px 17px;}
.instr .item .ic{width:38px;height:38px;flex:none;border-radius:50% 50% 50% 6px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;color:#fff;}
.instr .item > div > b:first-child{display:block;font-size:14.5px;margin-bottom:4px;}
.instr .item span b{display:inline;font-weight:700;}
.instr .item span{font-size:13px;line-height:1.6;color:rgba(255,255,255,.86);}
.valgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px;text-align:left;}
@media (max-width:760px){ .valgrid2{grid-template-columns:1fr;} }
.vbox{position:relative;border-radius:18px;padding:18px 20px;background:rgba(255,255,255,.12);
  border:1.5px solid rgba(255,255,255,.22);transition:all .45s cubic-bezier(.22,.9,.24,1);overflow:hidden;}
.vbox::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--vb);}
.vbox .vt{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:#fff;}
.vbox .vt .pl{width:17px;height:17px;flex:none;background:var(--vb);}
.vbox p{margin-top:9px;font-size:13.5px;line-height:1.65;color:rgba(255,255,255,.86);}
.vbox.live{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.85);
  animation:glowSoft 5.5s ease-in-out infinite;}
@keyframes glowSoft{
  0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.55), 0 0 14px 0 rgba(255,255,255,.18);}
  50%    {box-shadow:0 0 0 1.5px rgba(255,255,255,.9), 0 0 30px 6px rgba(255,255,255,.34);}
}
.vbox .tag2{position:absolute;top:14px;right:16px;font-size:10px;font-weight:700;letter-spacing:1px;
  padding:5px 12px;border-radius:999px;background:#fff;color:var(--vb);}
@media (prefers-reduced-motion: reduce){ .vbox.live{animation:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.9);} }

.intro{max-width:980px;width:100%;padding:8px 20px 60px;text-align:center;color:#fff;}
.intro h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;line-height:1.14;letter-spacing:-.4px;}
.intro .lede{margin:14px auto 0;max-width:62ch;font-size:16px;line-height:1.65;color:rgba(255,255,255,.92);}
.howgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:26px;text-align:left;}
.howcard{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:18px 18px 16px;}
.howcard .n{width:30px;height:30px;border-radius:50% 50% 50% 6px;background:#fff;color:var(--meteor);
  font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-bottom:11px;}
.howcard b{display:block;font-size:15.5px;margin-bottom:5px;}
.howcard span{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.88);}
.valgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px;margin-top:22px;text-align:left;}
.valcard{position:relative;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);
  border-radius:16px;padding:16px 17px;transition:all .45s cubic-bezier(.22,.9,.24,1);}
.valcard .vt{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;}
.valcard .vt .petal{width:15px;height:15px;flex:none;}
.valcard p{margin-top:8px;font-size:13px;line-height:1.6;color:rgba(255,255,255,.85);}
.valcard.dim{opacity:.62;}
.valcard.live{background:#fff;border-color:#fff;box-shadow:0 18px 40px rgba(0,0,0,.28);transform:scale(1.035);}
.valcard.live .vt{color:var(--ink);} .valcard.live p{color:var(--muted);}
.valcard .tag{position:absolute;top:-11px;right:14px;font-size:10.5px;font-weight:700;letter-spacing:.8px;
  padding:4px 11px;border-radius:999px;color:#fff;}
.introbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;}
/* ---------- Prezi-style camera ---------- */
.stagewrap{flex:1;position:relative;}
.canvas{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;padding-bottom:150px;
  transform-origin:50% 42%;animation:zoomIn .72s cubic-bezier(.22,.9,.24,1) both;}
@keyframes zoomIn{
  from{opacity:0;transform:scale(.55) translateY(40px) rotate(-1.2deg);}
  to  {opacity:1;transform:scale(1) translateY(0) rotate(0);}
}
.canvas.noanim{animation:none;}
.canvas.back{animation:zoomOut .6s cubic-bezier(.22,.9,.24,1) both;}
@keyframes zoomOut{ from{opacity:0;transform:scale(1.5) rotate(1deg);} to{opacity:1;transform:scale(1) rotate(0);} }
.orbit{position:absolute;border:1px dashed rgba(255,255,255,.18);border-radius:50%;pointer-events:none;}
.orbit.o1{width:78vmin;height:78vmin;left:50%;top:44%;transform:translate(-50%,-50%);}
.orbit.o2{width:112vmin;height:112vmin;left:50%;top:44%;transform:translate(-50%,-50%);opacity:.6;}

/* value constellation: all four values visible, this month's one zoomed in */
.vconst{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:6px;}
.vchip{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:12.5px;
  border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.75);background:rgba(255,255,255,.07);
  transition:all .4s cubic-bezier(.22,.9,.24,1);}
.vchip .dot{width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.8;}
.vchip.on{color:#fff;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.75);
  font-weight:700;font-size:13.5px;padding:9px 18px;box-shadow:0 8px 22px rgba(0,0,0,.22);transform:scale(1.06);}
.vchip.off{opacity:.5;}
.vofm{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;letter-spacing:1.2px;
  text-transform:uppercase;color:rgba(255,255,255,.8);}
.vofm::before,.vofm::after{content:"";width:26px;height:1px;background:rgba(255,255,255,.4);}

/* ---------- station: display title + orbiting people ---------- */
.stagehead{position:relative;}
.stagehead h2.bigtitle{position:relative;margin-top:10px;font-weight:700;letter-spacing:-3px;line-height:.92;
  font-size:clamp(40px,8.6vw,118px);color:#fff;transition:all .6s cubic-bezier(.22,.9,.24,1);}
.ghosttitle{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(1.55);z-index:0;
  font-size:clamp(40px,8.6vw,118px);font-weight:700;letter-spacing:-3px;line-height:.92;white-space:nowrap;
  color:rgba(255,255,255,.055);pointer-events:none;user-select:none;}
.stage.picked .stagehead h2.bigtitle{font-size:clamp(26px,3.4vw,44px);letter-spacing:-1px;opacity:.82;}
.stage.picked .ghosttitle{opacity:.5;}
.stage.picked .q, .stage.picked .defwrap{max-height:0;opacity:0;overflow:hidden;margin:0;transition:all .5s ease;}
.q,.defwrap{max-height:400px;opacity:1;transition:all .5s ease;}

/* people arranged in a gentle wave around the title */
.cluster{position:relative;z-index:1;transition:filter .5s ease;}
.cluster .chipav{transition:transform .5s cubic-bezier(.22,.9,.24,1),opacity .45s ease,filter .45s ease;}
.cluster .chipav:nth-child(4n+1){transform:translateY(16px);}
.cluster .chipav:nth-child(4n+2){transform:translateY(-8px);}
.cluster .chipav:nth-child(4n+3){transform:translateY(22px);}
.cluster .chipav:nth-child(4n+4){transform:translateY(0);}
.cluster .chipav:hover{transform:translateY(-6px) scale(1.06);}
.cluster.dimmed .chipav:not(.sel){opacity:.28;filter:blur(1.5px) saturate(.6);transform:scale(.9);}
.cluster.dimmed .chipav.sel{transform:scale(1.1);}
@media (prefers-reduced-motion: reduce){ .cluster .chipav{transform:none !important;} }

/* editorial pick card — same language as the intro chapters */
.pickcard{width:100%;max-width:720px;margin-top:26px;background:#fff;border-radius:22px;overflow:hidden;
  display:grid;grid-template-columns:132px 1fr;color:var(--ink);text-align:left;
  box-shadow:0 30px 70px rgba(0,0,0,.34);animation:pickIn .62s cubic-bezier(.22,.9,.24,1) both;}
@keyframes pickIn{
  0%{opacity:0;transform:translateY(26px) scale(.9);filter:blur(6px);}
  60%{opacity:1;filter:blur(0);}
  100%{opacity:1;transform:none;filter:blur(0);}
}
.pickcard .side{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pickcard .side .ring2{position:absolute;width:150%;aspect-ratio:1;border:1px solid rgba(255,255,255,.3);border-radius:50%;}
.pickcard .side .av2{width:62px;height:62px;border-radius:52% 52% 52% 8%;background:rgba(255,255,255,.22);
  border:2px solid rgba(255,255,255,.7);color:#fff;font-weight:700;font-size:20px;
  display:flex;align-items:center;justify-content:center;z-index:1;}
.pickcard .body2{padding:22px 26px 20px;min-width:0;}
.pickcard .kick{display:inline-flex;align-items:center;gap:9px;font-size:10.5px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;}
.pickcard .kick::before{content:"";width:20px;height:1.5px;background:currentColor;}
.pickcard .nm2{margin-top:9px;font-size:27px;font-weight:700;letter-spacing:-.7px;line-height:1.1;}
.pickcard .jt2{margin-top:3px;font-size:13.5px;color:var(--muted);}
.pickcard .change{float:right;font-size:12px;font-weight:600;color:var(--muted);border:1.5px solid var(--line);
  border-radius:999px;padding:6px 13px;background:#fff;}
.pickcard .change:hover{color:var(--ink);border-color:#B9CFE3;}
.quotewrap{position:relative;margin-top:18px;padding-left:30px;}
.quotewrap::before{content:"\201C";position:absolute;left:-2px;top:-10px;font-size:54px;line-height:1;
  font-family:Georgia,serif;color:var(--qc);opacity:.32;}
.quotewrap textarea{width:100%;border:none;outline:none;resize:none;background:transparent;
  font-size:16.5px;line-height:1.6;color:var(--ink);min-height:64px;padding:2px 0 8px;}
.quotewrap textarea::placeholder{color:#93A7B8;font-style:italic;}
.qline{height:2px;background:#E4ECF4;border-radius:2px;overflow:hidden;}
.qline i{display:block;height:100%;width:0;background:var(--qc);border-radius:2px;transition:width .35s cubic-bezier(.22,.9,.24,1);}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;font-size:12px;}
.qmeta .need2{font-weight:700;letter-spacing:.3px;color:#B4541E;}
.qmeta .need2.ok{color:#1F7F7C;}
.qmeta .cnt2{color:var(--muted);letter-spacing:.4px;}
@media (max-width:640px){
  .pickcard{grid-template-columns:1fr;} .pickcard .side{height:86px;}
  .pickcard .nm2{font-size:22px;} .pickcard .body2{padding:18px 18px 16px;}
}
/* mandatory reason */
.spot .req{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px;}
.spot .req b{color:#B4541E;}
.spot .req.ok b{color:#1F7F7C;}
.spot textarea.need{border-color:#F0C9B8;background:#FFFBF9;}

/* ---------- immersive voting stage ---------- */
.stage{width:100%;display:flex;flex-direction:column;align-items:center;color:#fff;
  padding:26px 20px 30px;position:relative;}
.stage .bigpetal{position:fixed;width:46vmin;height:46vmin;background:rgba(255,255,255,.07);
  right:-14vmin;bottom:-12vmin;z-index:-1;}
.stagehead{max-width:1100px;width:100%;text-align:center;margin-top:10px;position:relative;}
.stephint{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:rgba(255,255,255,.85);
  padding:6px 14px;border:1px solid rgba(255,255,255,.35);border-radius:999px;}
.stephint .petal{width:13px;height:13px;background:#fff;}
.stagehead h2{margin-top:16px;font-size:clamp(28px,3.6vw,42px);font-weight:700;line-height:1.12;letter-spacing:-.4px;}
.stagehead .q{margin-top:10px;font-size:16px;color:rgba(255,255,255,.92);}
.defwrap{margin-top:14px;}
.defbtn{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#fff;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:8px 16px;}
.defbody{max-width:640px;margin:14px auto 0;background:rgba(255,255,255,.13);border-radius:12px;
  padding:14px 18px;font-size:14px;line-height:1.6;text-align:left;}
.defbody b{display:block;font-size:11.5px;letter-spacing:.8px;margin-bottom:6px;opacity:.85;font-weight:700;}
.distinct{max-width:640px;margin:12px auto 0;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;
  color:rgba(255,255,255,.85);line-height:1.5;text-align:left;justify-content:center;}
.searchpill{margin-top:22px;width:100%;max-width:460px;display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:999px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.14);}
.searchpill input{border:none;outline:none;font-size:15px;width:100%;color:var(--ink);background:none;}
.searchpill svg{color:var(--muted);flex:none;}
.shufnote{margin-top:10px;font-size:12px;color:rgba(255,255,255,.7);}

/* spotlight for the chosen colleague */
.spot{width:100%;max-width:640px;margin-top:22px;background:#fff;border-radius:18px;padding:18px 20px;
  color:var(--ink);box-shadow:0 14px 34px rgba(0,0,0,.20);text-align:left;
  animation:spotIn .5s cubic-bezier(.22,.9,.24,1) both;}
@keyframes spotIn{
  from{opacity:0;transform:translateY(-10px) scale(.985);box-shadow:0 0 0 rgba(0,0,0,0);}
  to  {opacity:1;transform:none;}
}
@media (prefers-reduced-motion: reduce){ .spot{animation:none;} }
.spot .srow{display:flex;align-items:center;gap:14px;}
.spot .sav{width:56px;height:56px;border-radius:52% 52% 52% 6%;color:#fff;font-weight:600;font-size:18px;
  display:flex;align-items:center;justify-content:center;flex:none;}
.spot .snm{font-weight:700;font-size:17px;}
.spot .sjt{font-size:13px;color:var(--muted);margin-top:2px;}
.spot .slabel{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:.6px;color:#fff;
  padding:6px 12px;border-radius:999px;}
.spot textarea{width:100%;margin-top:14px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:14px;resize:vertical;min-height:56px;outline:none;}
.spot textarea:focus{border-color:var(--turq);}
.spot .count{font-size:11.5px;color:var(--muted);text-align:right;margin-top:4px;}
.spot .hint{font-size:12.5px;color:var(--muted);margin-top:10px;}

/* candidate cluster */
.cluster{margin-top:26px;display:flex;flex-wrap:wrap;justify-content:center;gap:20px 14px;max-width:900px;}
.chipav{width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  padding:10px 4px;border-radius:14px;transition:transform .12s;}
.chipav:not(.off):hover{transform:translateY(-3px);}
.chipav .cav{position:relative;width:64px;height:64px;border-radius:52% 52% 52% 8%;color:#fff;font-weight:600;font-size:19px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.18);
  border:3px solid transparent;transition:border-color .12s, box-shadow .12s;}
.chipav.sel .cav{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.35),0 8px 20px rgba(0,0,0,.25);}
.chipav .cav .mini{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;
  background:#fff;display:none;align-items:center;justify-content:center;}
.chipav.sel .cav .mini{display:flex;}
.chipav .cnm{font-size:13px;font-weight:600;color:#fff;line-height:1.25;}
.chipav .cjt{font-size:11px;color:rgba(255,255,255,.72);line-height:1.25;}
.chipav.off{opacity:.38;cursor:not-allowed;}
.chipav .cflag{font-size:10.5px;font-weight:700;color:#FFE1B0;}
.emptynote{margin-top:26px;color:rgba(255,255,255,.8);font-size:14px;}

/* glass bottom bar on color */
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:12px 28px;}
.pdots{display:flex;align-items:center;gap:9px;}
.pdots .d{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28);transition:all .2s;}
.pdots .d.done{background:rgba(255,255,255,.95);}
.pdots .d.now{width:28px;border-radius:7px;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22);}
.botbar.glass{background:rgba(10,16,34,.30);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.14);color:#fff;}
.botbar.light{background:#fff;border-top:1px solid var(--line);}
.progress{display:flex;align-items:center;gap:12px;}
.kchip{background:#fff;border-radius:12px;padding:6px;display:flex;}
.progress .kmark{width:36px;height:32px;}
.plabel{font-size:12.5px;line-height:1.35;}
.botbar.glass .plabel{color:rgba(255,255,255,.8);}
.botbar.light .plabel{color:var(--muted);}
.plabel b{display:block;font-size:13.5px;}
.botbar.glass .plabel b{color:#fff;}
.botbar.light .plabel b{color:var(--ink);}
.selected-note{font-size:13.5px;}
.botbar.glass .selected-note{color:rgba(255,255,255,.85);}
.navbtns{display:flex;gap:10px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:10px;font-weight:600;font-size:15px;}
.btn.onwhite{background:#fff;}
.btn.onwhite:disabled{background:rgba(255,255,255,.28);color:rgba(255,255,255,.75);cursor:not-allowed;}
.btn.ghostw{color:#fff;border:1.5px solid rgba(255,255,255,.5);}
.btn.primary{background:var(--blue);color:#fff;}
.btn.ghost{color:var(--muted);border:1.5px solid var(--line);background:#fff;}

/* ---------- review / done (light) ---------- */
.review{flex:1;max-width:760px;width:100%;margin:0 auto;padding:44px 24px 140px;}
.review h2{font-size:28px;font-weight:700;}
.completeband{margin-top:24px;display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:18px;
  background:linear-gradient(100deg, rgba(97,197,210,.14), rgba(30,94,162,.12) 34%, rgba(103,94,170,.12) 66%, rgba(63,166,125,.14));
  border:1.5px solid #D3E4F0;}
.completeband .kwrap{background:#fff;border-radius:999px;padding:11px 14px;box-shadow:0 6px 16px rgba(33,106,177,.14);display:flex;align-items:center;}
.cdots{display:flex;gap:7px;}
.cdots span{width:13px;height:13px;border-radius:50%;display:inline-block;}
.completeband .ct b{display:block;font-size:17px;font-weight:700;color:var(--ink);}
.completeband .ct span{font-size:13px;color:var(--muted);}
.completeband .okay{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#3BB691;color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;}
.review .sub{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.6;}
.voterline{margin-top:22px;display:flex;align-items:center;gap:14px;background:#EFF6FC;border:1.5px solid #CBE1F2;
  border-radius:12px;padding:14px 16px;}
.voterline .av{width:40px;height:40px;border-radius:52% 52% 52% 6%;background:linear-gradient(135deg,var(--pBL),var(--pTL));
  color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;}
.voterline .vn{font-weight:600;font-size:15px;}
.voterline .ve{font-size:12.5px;color:var(--muted);}
.voterline .edit{margin-left:auto;font-size:13px;color:var(--blue);font-weight:600;}
.rlist{margin-top:16px;display:grid;gap:12px;}
.rcard{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;}
.rcard .cat{flex:1;}
.rcard .cname{font-size:12.5px;font-weight:600;letter-spacing:.3px;}
.rcard .pname{font-size:16.5px;font-weight:600;margin-top:3px;}
.rcard .pjt{font-size:12.5px;color:var(--muted);margin-top:2px;}
.rcard .av{width:44px;height:44px;border-radius:52% 52% 52% 6%;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;}
.rcard .edit{font-size:13px;color:var(--blue);font-weight:600;padding:8px 12px;border-radius:8px;}
.rcard .edit:hover{background:var(--bg);}
.subm-err{margin-top:22px;background:#FDEDE7;border:1.5px solid #F0C9B8;color:#B4541E;border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:600;}
.lock{margin-top:22px;display:flex;gap:10px;align-items:flex-start;background:#FFF8E8;border:1.5px solid #F0DFAF;
  border-radius:12px;padding:14px 16px;font-size:13.5px;color:#7A5E14;line-height:1.55;}
.done-hero{flex:1;display:flex;align-items:center;justify-content:center;background:#fff;}
.done-inner{max-width:600px;padding:48px 28px;text-align:center;}
.done-mark-img{height:86px;width:auto;display:block;margin:0 auto;}
.done-inner h2{margin-top:26px;font-size:27px;font-weight:700;}
.done-inner .pill{display:inline-block;margin-top:14px;padding:8px 18px;border-radius:999px;
  background:#EAF8F3;color:#1F7F7C;font-weight:600;font-size:14px;}
.done-inner p{margin-top:16px;color:var(--muted);font-size:15px;line-height:1.65;}
.done-actions{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.done-inner .quote{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);font-style:italic;color:var(--muted);font-size:14.5px;}

/* ---------- IC console ---------- */
.icwrap{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:34px 24px 70px;}
.ichead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.ichead h2{font-size:26px;font-weight:700;}
.icpill{padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;}
.icpill.open{background:#EAF8F3;color:#1F7F7C;} .icpill.closed{background:#FDEDE7;color:#B4541E;}
.icout{margin-left:auto;font-size:13px;color:var(--blue);font-weight:600;}
.icgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px;}
.ickpi{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;}
.ickpi .l{font-size:12px;color:var(--muted);} .ickpi .v{font-size:22px;font-weight:700;color:var(--blue);margin-top:4px;}
.icsec{margin-top:28px;} .icsec h3{font-size:16px;color:var(--blue);margin-bottom:10px;}
.icsec .hint{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;}
.icbtns{display:flex;flex-wrap:wrap;gap:10px;}
.icrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#fff;
  border:1.5px solid var(--line);border-radius:10px;margin-bottom:7px;font-size:13.5px;}
.icrow .mut{color:var(--muted);font-size:12.5px;}
.iccat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.iccat .cn{font-size:13px;font-weight:700;margin-bottom:8px;}
.iccat .tl{font-size:13.5px;display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);}
.iccat .tl:last-child{border-bottom:none;}
.iccat .win{font-weight:700;}
.linkbox{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;}
.linkbox input{flex:1;border:none;outline:none;font-size:13px;color:var(--ink);background:none;}
.cyclebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;}
.cyclebar select,.cyclebar input{border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;outline:none;}
.isechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px;}
.isechead h3{margin-bottom:0;}
.btn.small{padding:8px 16px;font-size:13px;}
.empgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.empcard{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:13px 14px;}
.empcard .empinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.empcard .empinfo b{font-size:14px;line-height:1.25;}
.empcard .mut{font-size:12px;color:var(--muted);}
.empcard .eml{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.empadd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.empadd input{flex:1;min-width:170px;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;outline:none;}
.empadd input:focus{border-color:var(--turq);}
.empav{width:34px;height:34px;border-radius:52% 52% 52% 6%;color:#fff;font-weight:600;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex:none;}
.empdel{font-size:12.5px;font-weight:600;color:#B4541E;border:1.5px solid #F0D4C4;border-radius:8px;padding:7px 13px;background:#fff;}
.empdel:hover{background:#FDF3ED;}
.empmsg{font-size:12.5px;border-radius:9px;padding:9px 12px;margin-bottom:10px;}
.empmsg.good{background:#EAF8F3;color:#1F7F7C;} .empmsg.bad{background:#FDEDE7;color:#B4541E;}
.btn.isoff{opacity:.4;cursor:not-allowed;pointer-events:auto;}
.mailcard{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px 16px;
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.mailcard .mc-t{min-width:0;}
.mailcard .mc-t b{display:block;font-size:14.5px;line-height:1.3;}
.mailcard .mc-t span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mailcard .mc-b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:560px;max-width:100%;}
.mailcard .mc-b .btn{width:100%;justify-content:center;text-align:center;padding:11px 10px;font-size:13.5px;line-height:1.25;}
@media (max-width:980px){ .mailcard{grid-template-columns:1fr;} .mailcard .mc-b{width:100%;} }
.mailprev{margin:4px 0 14px;border:1.5px dashed #C9DDEE;border-radius:14px;overflow:auto;background:#F2F6FA;}
#busybar{position:fixed;top:0;left:0;height:3px;width:0;z-index:99;background:linear-gradient(90deg,var(--turq),var(--topaz));
  transition:width .25s ease,opacity .3s ease;opacity:0;}
#busybar.on{width:92%;opacity:1;transition:width 8s cubic-bezier(.1,.8,.2,1),opacity .15s;}
.demobar{margin-bottom:18px;background:#FFF4E5;border:1.5px solid #F2C48D;color:#8A5A16;
  border-radius:12px;padding:13px 16px;font-size:13.5px;line-height:1.6;}
.demobar code{background:#FBE8CE;border-radius:5px;padding:1px 6px;font-family:Consolas,monospace;font-size:12px;}
.icnote{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.6;background:#EFF6FC;border:1.5px solid #CBE1F2;border-radius:12px;padding:12px 14px;}

@media (max-width:640px){
  .topbar{padding:10px 16px;} .brand img{height:22px;} .brand .app{display:none;}
  .hero-logo{height:32px;}
  .stage{padding:18px 12px 170px;}
  .stagehead h2{font-size:27px;}
  .cluster{gap:16px 6px;} .chipav{width:88px;} .chipav .cav{width:58px;height:58px;font-size:17px;}
  .botbar{padding:10px 12px;flex-wrap:wrap;} .selected-note{display:none;}
  .plabel{display:none;}
}

/* ---------- IC console: small screens ---------- */
.linkbox input{min-width:0;}
@media (max-width:640px){
  .icwrap{padding:20px 12px 70px;}
  .ichead{gap:8px;}
  .ichead h2{font-size:19px;line-height:1.25;}
  .icout{margin-left:auto;}
  .icgrid{grid-template-columns:repeat(2,1fr);gap:9px;}
  .ickpi{padding:11px 12px;} .ickpi .v{font-size:18px;}
  .icsec h3{font-size:15px;}
  .mailcard{flex-direction:column;align-items:stretch;gap:10px;}
  .mailcard .mc-b{width:100%;}
  .mailcard .mc-b .btn{flex:1 1 46%;justify-content:center;padding:11px 8px;font-size:13px;}
  .icbtns .btn{flex:1 1 46%;justify-content:center;font-size:13px;}
  .linkbox{flex-wrap:wrap;}
  .linkbox input{flex:1 1 100%;order:1;}
  .linkbox span{order:0;} .linkbox a,.linkbox button{order:2;flex:1;justify-content:center;text-align:center;}
  .cyclebar select,.cyclebar input{flex:1 1 40%;min-width:0;}
  .cyclebar .btn{flex:1 1 46%;justify-content:center;font-size:13.5px;padding:11px 8px;}
  .empgrid{grid-template-columns:1fr;}
  .empadd input{flex:1 1 100%;min-width:0;}
  .empadd .btn{flex:1 1 100%;justify-content:center;}
  .icrow{flex-wrap:wrap;}
  .isechead{flex-wrap:wrap;}
  .demobar{font-size:12.5px;}
  .review{padding:26px 14px 150px;}
  .rcard{gap:10px;padding:13px 12px;}
  .completeband{flex-wrap:wrap;gap:10px;padding:13px 12px;}
  .completeband .okay{margin-left:0;}
  .navbtns .btn{padding:11px 14px;font-size:14px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>

const isLiveUrlOk = u => /^https:\/\/[^\s]+\.[^\s]+/.test((u||"").trim()) && !u.includes("...") && !u.includes("/\u2026/") && !u.includes("…");
const isIC = () => voter.email.trim().toLowerCase() === IC_MAILBOX
  || normName(voter.name) === "internal communication";
const cycleVotes = () => VOTES_STORE.filter(v => v.cycle === CYCLE);
function tallies(){ const t = {}; CATS.forEach(c => t[c.code] = {});
  cycleVotes().forEach(v => CATS.forEach(c => { const sel = v.selections && v.selections[c.code];
    if(sel && sel.id) t[c.code][sel.id] = (t[c.code][sel.id] || 0) + 1; })); return t; }
function nameOf(id){
  const p = PEOPLE.find(x => x.id === id); if(p) return p.name;
  for(const v of VOTES_STORE){ for(const c of CATS){ const sel = v.selections[c.code];
    if(sel && sel.id === id) return sel.name; } }
  return id;
}
function top1Of(code, t){
  const list = topList(code, t);
  if(!list.length) return { text:"—", n:0, tie:false };
  const max = list[0].n, tops = list.filter(e=>e.n===max);
  return { text: tops.map(e=>nameOf(e.id)).join(" & ") + (tops.length>1?" (tie)":""), n:max, tie:tops.length>1 };
}
function topList(code, t){ return Object.entries(t[code])
  .map(([id, n]) => ({ id, n }))
  .sort((a, b) => b.n - a.n); }
const emailInRoster = () => {
  const e = voter.email.trim().toLowerCase();
  return !!e && PEOPLE.some(p => (p.email||"").toLowerCase() === e);
};
const isSelf = p => {
  const e = voter.email.trim().toLowerCase();
  if(e && (p.email||"").toLowerCase() === e) return true;   // the reliable match
  if(emailInRoster()) return false;                         // email identified the voter — namesakes are other people
  return !!voter.name && normName(p.name) !== "" && normName(p.name) === normName(voter.name);
};
const nameOk = () => voter.name.trim().split(/\s+/).filter(w=>w.length>=2).length >= 2;
const emailOk = () => /^[^\s@]+@kabi\.ai$/i.test(voter.email.trim());
function pickedElsewhere(code, pid){
  if(!VALUE_CODES.includes(code)) return null;
  for(const c of VALUE_CODES){ if(c!==code && picks[c]===pid) return CATS.find(x=>x.code===c).short; }
  return null;
}

}
function kmark(size){
  const done = c => !!picks[c];
  const cur  = CATS[step-1] ? CATS[step-1].petal : "";
  const pd = (pos,cls) => `<span class="p petal pt-${pos} ${done(cls)?'lit-'+pos:''} ${cur===pos?'now':''}"></span>`;
  return `<span class="kmark" style="width:${size}px;height:${Math.round(size*0.9)}px">
    ${pd("tl","INNOVATE")}${pd("tr","BUILD")}${pd("bl","KABITAL")}${pd("br","GROW")}
    <span class="core ${done("EOM")?'lit':''} ${cur==='core'?'now':''}"></span></span>`;
}
const activeCat = () => CATS.find(c=>c.code===ACTIVE_VALUE) || CATS[1];
const stageCats = () => [CATS[0], activeCat()];              // [Employee of the Month, Value of the Month]
const whyOk = code => ((whys[code]||"").trim().length >= MIN_WHY);
function rosterDupes(){
  const byEmail={}, byName={};
  PEOPLE.forEach(p=>{ const e=(p.email||"").toLowerCase().trim(); const n=normName(p.name);
    if(e) byEmail[e]=(byEmail[e]||0)+1; if(n) byName[n]=(byName[n]||0)+1; });
  const out=[];
  Object.keys(byEmail).forEach(e=>{ if(byEmail[e]>1) out.push({label:e, n:byEmail[e]}); });
  Object.keys(byName).forEach(n=>{ if(byName[n]>1){
    const p=PEOPLE.find(x=>normName(x.name)===n);
    if(!out.some(o=>o.label===(p.email||"").toLowerCase())) out.push({label:p.name+" (same name)", n:byName[n]});
  }});
  return out;
}
function pdots(){
  return `<span class="pdots" aria-label="Progress">${stageCats().map((c,i)=>{
    const n=i+1, cls = n===step?"now": (picks[c.code] && whyOk(c.code))?"done":"";
    return `<span class="d ${cls}" title="${esc(c.name)}"></span>`;}).join("")}</span>`;
}

}

/* one petal of the K, as a hairline path: rounded on three corners, sharp at the centre */
function petalPath(S, r){
  return `M ${-S+r} ${-S} H ${-r} A ${r} ${r} 0 0 1 0 ${-S+r} V 0 H ${-S+r} A ${r} ${r} 0 0 1 ${-S} ${-r} V ${-S+r} A ${r} ${r} 0 0 1 ${-S+r} ${-S} Z`;
}
function kLineArt(){
  const S = 74, r = 26, len = 4*(S-r) + 3*Math.PI*r;   // rough path length for the draw animation
  const P = [
    {rot:0,   col:"#62C6D3"},   // top-left  · turquoise
    {rot:90,  col:"#1D57A3"},   // top-right · blue
    {rot:270, col:"#2866A8"},   // bottom-left
    {rot:180, col:"#3FAA7E"},   // bottom-right · green
  ];
  const rays = Array.from({length:24},(_,i)=>{
    const a = i*15*Math.PI/180, r1 = 108, r2 = 126;
    return `<line class="ray" x1="${(Math.cos(a)*r1).toFixed(1)}" y1="${(Math.sin(a)*r1).toFixed(1)}" x2="${(Math.cos(a)*r2).toFixed(1)}" y2="${(Math.sin(a)*r2).toFixed(1)}"/>`;
  }).join("");
  return `<svg viewBox="-150 -150 300 300" aria-hidden="true">
    <g class="spin"><circle class="ring4 dash" cx="0" cy="0" r="132"/></g>
    <g class="spin-r">${rays}</g>
    <circle class="ring4" cx="0" cy="0" r="104"/>
    <circle class="ring4" cx="0" cy="0" r="148" opacity=".5"/>
    ${P.map((p,i)=>`<g transform="rotate(${p.rot})">
        <path class="fillsoft" d="${petalPath(S,r)}" fill="${p.col}"/>
        <path class="pl2" style="--len:${len.toFixed(0)};animation-delay:${(i*.28).toFixed(2)}s" d="${petalPath(S,r)}" stroke="${p.col}"/>
      </g>`).join("")}
    <circle class="cdot2" cx="0" cy="0" r="4"/>
  </svg>`;
}
/* faint KABi hairlines behind every screen: arcs from a single origin, like the mark's petals */
function lineField(dark){
  const arcs = [
    {r:520, c:"#62C6D3"}, {r:690, c:"#1D57A3"}, {r:860, c:"#2866A8"}, {r:1030, c:"#3FAA7E"},
  ].map(a=>`<circle class="hl" cx="102%" cy="-8%" r="${a.r}" stroke="${a.c}"/>`).join("");
  const diag = [
    {x:"12%", c:"#62C6D3"}, {x:"38%", c:"#1D57A3"}, {x:"64%", c:"#3FAA7E"},
  ].map(d=>`<line class="hl" x1="${d.x}" y1="-5%" x2="calc(${d.x} + 190px)" y2="105%" stroke="${d.c}"/>`).join("");
  return `<div class="lines ${dark?"dark":""}"><svg preserveAspectRatio="none">${arcs}${diag}</svg></div>`;
}
const CHEV = size => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9 7 9-7"/></svg>`;

function setupStory(){
  const story = document.getElementById("story"); if(!story) return;
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("in"); }),
    {root: story, threshold:.18});
  story.querySelectorAll(".rev").forEach(el=>io.observe(el));
  const chIo = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){
      const i = +e.target.dataset.ch;
      const n=document.getElementById("chnum"), nm=document.getElementById("chname"), d=document.getElementById("cdots");
      if(n) n.textContent = i+1;
      if(nm) nm.textContent = CH_NAMES[i];
      if(d) [...d.children].forEach((c,j)=>c.classList.toggle("on", j===i));
    }}), {root: story, threshold:.55});
  story.querySelectorAll(".chap").forEach(el=>chIo.observe(el));
}

async function submitVote(){
  const cats = stageCats();
  for(let i=0;i<cats.length;i++){
    const p = PEOPLE.find(x=>x.id===picks[cats[i].code]);
    if(p && isSelf(p)){ delete picks[cats[i].code]; go(i+1); return; }
    if(!p || !whyOk(cats[i].code)){ go(i+1); return; }     // reasons are mandatory
  }
  const payload = buildPayload();
  if(!SUBMIT_ENDPOINT){ VOTES_STORE.push(payload); console.log("EOM_VOTE payload (demo mode)", payload); go(7); return; }
  submitState="sending"; submitErr=""; render();
  try{
    await api(payload);                     // receiver validates & writes the Excel/Sheet row
    VOTES_STORE.push(payload);
    submitState="idle"; go(7);
  }catch(e){
    submitState="idle";
    const msg = String(e.message||"");
    submitErr = msg.includes("duplicate") ? "You've already submitted your vote for this month."
             : msg.includes("closed")    ? "Voting for this month has closed."
             : msg.includes("ineligible")? "You are not eligible for this voting cycle."
             : "Something went wrong while submitting. Please check your connection and try again.";
    render();
  }
}
async function checkPw(){
  if(pwBusy) return;
  const v = (document.getElementById("pw")||{}).value || "";
  if(!SUBMIT_ENDPOINT){
    if(v === IC_PASSCODE_DEMO){ icCode = v; icAuthed = true; pwErr = false; go(9); }
    else { pwErr = true; pwMsg = "Incorrect access code."; render(); }
    return;
  }
  pwBusy = true; pwErr = false; pwMsg = ""; render();
  const done = ok => { pwBusy = false; if(ok){ icCode=v; icAuthed=true; go(9); } else render(); };
  try{
    await apiGet({action:"auth", code: v});
    done(true); return;
  }catch(e){
    const msg = String(e.message||e||"unknown error");
    if(/unknown|not found|bad request/i.test(msg)){
      try{ await apiGet({action:"votes", code: v, cycle: CYCLE}); done(true); return; }
      catch(e2){
        const m2 = String(e2.message||"");
        pwErr = true;
        pwMsg = /unauthor/i.test(m2) ? "Incorrect access code."
              : "Couldn't verify with the receiver: " + m2 + " · Update the Apps Script and deploy a NEW version.";
        done(false); return;
      }
    }
    pwErr = true;
    pwMsg = /unauthor/i.test(msg) ? "Incorrect access code — it must match SECRET in the receiver script."
          : "Couldn't reach the receiver: " + msg + " · Check that the Web app is deployed with access: Anyone.";
    done(false);
  }
}

  if(!y || y<2024 || y>2100){ cycleMsg="err:Enter a valid year."; render(); return; }
  const newCycle = y + "-" + ("0"+m2).slice(-2);
  const newValue = (document.getElementById("ncV")||{}).value || ACTIVE_VALUE;
  cycleBusy = true; cycleMsg = ""; render();

const IN_GAS = () => typeof google!=="undefined" && google.script && google.script.run;
function gasApi(req){
  return new Promise((res, rej)=>{
    google.script.run
      .withSuccessHandler(o=>{ if(o && o.ok===false) rej(new Error(o.error||"error")); else res(o||{}); })
      .withFailureHandler(e=>rej(new Error((e && e.message) || "server error")))
      .clientApi(req);
  });
}
async function fetchT(url, opts, ms){
  const ac = new AbortController();
  const t = setTimeout(()=>ac.abort(), ms || 20000);
  try{ return await fetch(url, Object.assign({signal: ac.signal}, opts||{})); }
  catch(e){ throw new Error(e.name==="AbortError" ? "timed out after "+((ms||20000)/1000)+"s — the receiver didn't answer" : (e.message||"network error")); }
  finally{ clearTimeout(t); }
}
function b64url(str){
  const bytes = new TextEncoder().encode(str);
  let bin=""; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
function flatParams(body){                 // writes as ordinary query parameters
  const q = {};
  Object.keys(body).forEach(k=>{
    const v = body[k];
    if(v===undefined || v===null) return;
    q[k] = (typeof v === "object") ? JSON.stringify(v) : String(v);
  });
  return q;
}
async function readJson(r){
  let j=null; try{ j = await r.json(); }catch(e){}
  if(!j) throw new Error("HTTP "+r.status);
  if(!r.ok) throw new Error("HTTP "+r.status);
  if(j.ok===false) throw new Error(j.error||"error");
  return j;
}
const CHANNELS = {
  // "query" is the same request shape that already works for reading, so it is tried first.
  query: b => fetchT(SUBMIT_ENDPOINT+"?"+new URLSearchParams(flatParams(b)).toString()+"&_r="+Date.now(), null, 45000),
  pack:  b => fetchT(SUBMIT_ENDPOINT+"?p="+encodeURIComponent(b64url(JSON.stringify(b)))+"&_r="+Date.now(), null, 45000),
  post:  b => fetchT(SUBMIT_ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(b)}, 15000),
};
let writeChannel = "";                      // learned once, then reused
async function api(body){
  if(IN_GAS()) return gasApi({post: body});
  busy(1);
  const order = writeChannel ? [writeChannel, "query"] : ["query","pack","post"];
  let lastErr = null;
  try{
    const tried = [];
    for(const name of order){
      if(tried.indexOf(name) >= 0) continue;
      tried.push(name);
      try{
        const j = await readJson(await CHANNELS[name](body));
        writeChannel = name; return j;
      }catch(e){
        const m = String(e.message||"");
        // A real answer from the receiver (duplicate / unauthorized / closed …) must never be retried.
        if(!/HTTP|Failed to fetch|NetworkError|load failed|timed out|abort/i.test(m)) throw e;
        lastErr = new Error(name + ": " + m);
      }
    }
    writeChannel = "";
    throw new Error((lastErr && lastErr.message ? lastErr.message : "no channel worked")
      + " — no write channel reached the receiver. Deploy the latest google-apps-script.gs as a NEW version.");
  } finally { busy(-1); }
}
async function apiGet(params){
  if(IN_GAS()) return gasApi({get: params});
  busy(1);
  try{
    const url = SUBMIT_ENDPOINT+"?"+new URLSearchParams(params).toString();
    try{
      return await readJson(await fetchT(url, null, 15000));
    }catch(e){
      const m = String(e.message||"");
      if(!/timed out|Failed to fetch|NetworkError|load failed|abort/i.test(m)) throw e;
      // First call after deploying a new version can be slow (cold start) — try once more, patiently.
      return await readJson(await fetchT(url + "&_r=" + Date.now(), null, 45000));
    }
  } finally { busy(-1); }
}

const xmlUn = t => String(t||"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n)).replace(/&amp;/g,"&");
async function inflateRaw(u8){
  const ds=new DecompressionStream("deflate-raw");
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());
}
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let e=buf.byteLength-22; while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error("not a zip");
  let off=dv.getUint32(e+16,true), n=dv.getUint16(e+10,true); const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true),
          nlen=dv.getUint16(off+28,true), xlen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true),
          lho=dv.getUint32(off+42,true),
          name=new TextDecoder().decode(u8.slice(off+46,off+46+nlen));
    const lnlen=dv.getUint16(lho+26,true), lxlen=dv.getUint16(lho+28,true);
    files[name]={method,data:u8.slice(lho+30+lnlen+lxlen, lho+30+lnlen+lxlen+csize)};
    off+=46+nlen+xlen+clen;
  }
  return files;
}
async function parseXlsx(buf){
  const files=await unzip(buf);
  let shared=[]; const ssf=files["xl/sharedStrings.xml"];
  if(ssf){ const t=new TextDecoder().decode(ssf.method===8? await inflateRaw(ssf.data):ssf.data);
    shared=[...t.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>xmlUn([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(""))); }
  const sheetName=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];
  if(!sheetName) throw new Error("no worksheet");
  const sf=files[sheetName];
  const xml=new TextDecoder().decode(sf.method===8? await inflateRaw(sf.data):sf.data);
  const rows=[];
  for(const rm of xml.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)){
    const cells=[];
    for(const cm of rm[1].matchAll(/<c\s([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const attrs=cm[1]||"", inner=cm[2]||"";
      const rAttr=/r="([A-Z]+)\d+"/.exec(attrs);
      let ci=cells.length;
      if(rAttr){ ci=0; for(const ch of rAttr[1]) ci=ci*26+(ch.charCodeAt(0)-64); ci--; }
      const tAttr=/t="(\w+)"/.exec(attrs);
      let val="";
      const v=/<v>([\s\S]*?)<\/v>/.exec(inner), is=/<is>[\s\S]*?<t[^>]*>([\s\S]*?)<\/t>/.exec(inner);
      if(is) val=xmlUn(is[1]);
      else if(v){ val = (tAttr && tAttr[1]==="s") ? (shared[parseInt(v[1],10)]||"") : xmlUn(v[1]); }
      cells[ci]=String(val);
    }
    rows.push(Array.from(cells,x=>x==null?"":x));
  }
  return rows;
}
function parseCsvText(t){
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cur); cur=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n')i++; row.push(cur); cur="";
      if(row.some(x=>x.trim()!=="")) rows.push(row); row=[]; }
    else cur+=ch; }
  if(cur!==""||row.length){ row.push(cur); if(row.some(x=>x.trim()!=="")) rows.push(row); }
  return rows;
}
function parseSpreadsheetML(t){
  return [...t.matchAll(/<Row[^>]*>([\s\S]*?)<\/Row>/g)]
    .map(rm=>[...rm[1].matchAll(/<Data[^>]*>([\s\S]*?)<\/Data>/g)].map(x=>xmlUn(x[1])));
}
function rowsToRecords(rows){
  let hi=-1, map=null;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const cells=rows[i].map(x=>String(x||"").trim().toLowerCase());
    // a real header row names BOTH columns in separate, short cells —
    // instruction sentences ("Emails must be @kabi.ai …") can never qualify
    const em=cells.findIndex(x=>x && x.length<=30 && /e-?mail/.test(x));
    if(em<0) continue;
    const nm=cells.findIndex((x,j)=>j!==em && x && x.length<=30 && /name/.test(x) && !/e-?mail/.test(x));
    if(nm<0) continue;
    const jt=cells.findIndex((x,j)=>j!==em && j!==nm && x && x.length<=30 && /(job|title|position|role)/.test(x));
    hi=i; map={nm,em,jt}; break;
  }
  if(hi<0) throw new Error("couldn't find a header row that names both a Name column and an Email column");
  return rows.slice(hi+1).map(r=>({ name:String(r[map.nm]||"").trim(),
    email:String(r[map.em]||"").trim(), jt: map.jt>=0? String(r[map.jt]||"").trim() : "" }));
}
async function icBulkUpload(file){
  if(!file) return;
  empListOpen=true; empMsg="ok:Reading "+file.name+" …"; render();
  let rows;
  try{
    const buf=await file.arrayBuffer(); const head=new Uint8Array(buf.slice(0,4));
    if(head[0]===0x50 && head[1]===0x4B){
      if(typeof DecompressionStream==="undefined") throw new Error("this browser can't read .xlsx — save the file as CSV and upload that");
      rows=await parseXlsx(buf);
    } else {
      const text=new TextDecoder().decode(buf);
      rows = text.trimStart().startsWith("<?xml") ? parseSpreadsheetML(text) : parseCsvText(text);
    }
    const recs=rowsToRecords(rows);
    const seenMail=new Set(PEOPLE.map(p=>p.email.toLowerCase()));
    const seenName=new Set(PEOPLE.map(p=>normName(p.name)));
    const fileMail=new Set(), valid=[], dupFile=[], dupList=[], dupName=[], bad=[];
    recs.forEach(r=>{
      const name=r.name, email=(r.email||"").toLowerCase(), jt=r.jt;
      if(!name && !email) return;
      if(name.trim().split(/\s+/).filter(w=>w.length>=2).length<2){ bad.push((email||name)+" — name needs first & family"); return; }
      if(!/^[^\s@]+@kabi\.ai$/i.test(email)){ bad.push((email||name)+" — not a @kabi.ai email"); return; }
      if(fileMail.has(email)){ dupFile.push(email); return; }
      if(seenMail.has(email)){ dupList.push(email); return; }
      if(seenName.has(normName(name))){ dupName.push(name); }   // warn, but still add (same name ≠ same person)
      fileMail.add(email); valid.push({name:name.trim(), email, jt});
    });
    const report = parts => parts.filter(Boolean).join(" · ");
    const dupNote = report([
      dupFile.length? "Repeated inside the file: "+dupFile.length+" ("+dupFile.slice(0,3).join(", ")+(dupFile.length>3?" …":"")+")" : "",
      dupList.length? "Already in the list: "+dupList.length+" ("+dupList.slice(0,3).join(", ")+(dupList.length>3?" …":"")+")" : "",
      dupName.length? "⚠ Same name as an existing colleague (added anyway): "+dupName.slice(0,3).join(", ")+(dupName.length>3?" …":"") : "",
      bad.length? "Invalid rows: "+bad.length+" ("+bad.slice(0,2).join(", ")+(bad.length>2?" …":"")+")" : ""
    ]);
    const skipped = dupFile.concat(dupList).concat(bad);
    if(!valid.length){ empMsg="err:Nothing added from "+file.name+". "+(dupNote||"No valid rows found."); render(); return; }
    if(SUBMIT_ENDPOINT){
      const j=await api({action:"bulkAdd", code:icCode, emps:valid});
      await loadRoster();
      const srvSkip=(j.skipped||[]);
      empMsg="ok:Added "+(j.added!=null?j.added:valid.length)+" from "+file.name
        + (dupNote? " · "+dupNote : "")
        + (srvSkip.length? " · Receiver skipped "+srvSkip.length : "");
    } else {
      valid.forEach(v=>{
        const num=Math.max(0,...PEOPLE.map(p=>parseInt(p.id.slice(3),10)||0))+1;
        const id="EMP"+String(num).padStart(3,"0");
        PEOPLE.push({id, name:v.name, email:v.email, jt:v.jt, g:AV_G[PEOPLE.length%AV_G.length]});
        CATS.forEach(c=>orders[c.code].splice(Math.floor(Math.random()*(orders[c.code].length+1)),0,id));
      });
      empMsg="ok:Added "+valid.length+" from "+file.name + (dupNote? " · "+dupNote : "");
    }
  }catch(e){ empMsg="err:Couldn't read the file — "+(e.message||"unknown error"); }
  render();
}
